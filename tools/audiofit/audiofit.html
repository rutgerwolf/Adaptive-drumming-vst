<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Audio Fit Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3743; --text:#dde3ea; --dim:#8b97a6;
  --accent:#4ea1ff; --accent2:#2f6fb5; --marker:#ffb74d; --cursor:#ff5a5a; --wave:#6fcf97;
  --green:#3fb950; --orange:#e3a008; --red:#e5534b; --blocked:#8e44ad;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent2);border-color:var(--accent)}
input[type=text],input[type=number],select{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input[type=text]:focus,select:focus{outline:1px solid var(--accent)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
header h1 small{color:var(--dim);font-weight:400;margin-left:6px}
header .sp{flex:1}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{flex:1 1 40%;min-height:230px;display:grid;grid-template-columns:190px 1fr 220px;border-bottom:1px solid var(--line)}
.side{background:var(--panel);overflow:auto;padding:6px}
.side h2,.blocks h2{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:2px 2px 6px;text-transform:uppercase}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.src{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;gap:4px;align-items:center;word-break:break-all}
.src:hover{background:var(--panel2)}
.src.active{background:var(--accent2)}
.src .meta{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.src.missing{color:var(--orange)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.wavewrap{position:relative;flex:1;min-height:150px;background:#0c0f13}
.wavewrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
.wavewrap.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
#scroll{width:100%;margin:0;height:14px;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctrl .grp{display:flex;align-items:center;gap:4px}
.ctrl label{color:var(--dim)}
.tf{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.nud button{padding:2px 5px;font-size:11px}
.chk{display:flex;align-items:center;gap:3px;color:var(--text)}
.mrow{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow .mn{flex:1;word-break:break-all}
.mrow .mt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.mrow button{padding:0 5px;font-size:11px}
.between{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:grid;gap:4px}
.between select{width:100%}
.blocks{flex:1 1 60%;min-height:200px;overflow:auto;background:var(--bg);padding:6px 10px}
.blocks .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:6px 8px}
.blk.active{border-color:var(--accent)}
.blk .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .bh .nm{width:130px}
.blk .bh .td{width:84px;text-align:right}
.badge{padding:1px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.green{background:rgba(63,185,80,.18);color:var(--green);border-color:var(--green)}
.orange{background:rgba(227,160,8,.18);color:var(--orange);border-color:var(--orange)}
.red{background:rgba(229,83,75,.18);color:var(--red);border-color:var(--red)}
.blocked{background:rgba(142,68,173,.25);color:#c58be0;border-color:var(--blocked)}
.seg{display:none}
.seg div{background:var(--accent2);border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;min-width:6px;border-bottom:3px solid transparent}
.seg div{color:#fff!important}
.seg div.green{border-bottom-color:var(--green)}.seg div.orange{border-bottom-color:var(--orange)}
.seg div.red{border-bottom-color:var(--red)}.seg div.blocked{border-bottom-color:var(--blocked)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
table.fr{border-collapse:collapse;width:100%;font-size:12px}
table.fr th{color:var(--dim);text-align:left;font-weight:500;padding:2px 6px;border-bottom:1px solid var(--line)}
table.fr td{padding:2px 6px;border-bottom:1px solid #242a33;font-variant-numeric:tabular-nums}
table.fr select{padding:1px 3px}
tr.miss td{color:var(--orange)}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 10px;display:flex;gap:10px;align-items:center;position:relative}
#status{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#status.err{color:var(--red)}#status.warn{color:var(--orange)}#status.ok{color:var(--green)}
#log{position:absolute;left:0;right:0;bottom:100%;max-height:220px;overflow:auto;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;display:none;font-size:12px}
#log div.err{color:var(--red)}#log div.warn{color:var(--orange)}
#ctx{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px;z-index:50;min-width:130px}
#ctx div{padding:5px 12px;cursor:pointer}#ctx div:hover{background:var(--accent2)}
#mname{position:absolute;display:none;z-index:20;width:120px}
.dim{color:var(--dim)}
.tl{position:relative;margin:6px 0;user-select:none}
.tl .ruler{position:relative;height:14px;color:var(--dim);font-size:10px}
.tl .ruler span{position:absolute;top:0;border-left:1px solid var(--line);padding-left:3px;height:14px;white-space:nowrap}
.tl .row{position:relative;height:40px;background:#12161c;border:1px solid var(--line);border-radius:4px;margin-top:2px;overflow:hidden}
.tl + .row,.row.voice{height:32px}
.tl .hint{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;color:var(--dim);font-size:11px}
.endline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);z-index:6;pointer-events:none}
.tfr{position:absolute;top:3px;bottom:3px;background:var(--accent2);border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;border-bottom:3px solid transparent;color:#fff;cursor:grab;z-index:1}
.tfr.green{border-bottom-color:var(--green)}.tfr.orange{border-bottom-color:var(--orange)}.tfr.red{border-bottom-color:var(--red)}.tfr.blocked{border-bottom-color:var(--blocked)}
.tfr.sel,.tvo.sel{outline:2px solid #fff;outline-offset:-1px}
.tfr.miss{background:#6b5a1f}
.tfr.anc{outline:2px dashed var(--marker);outline-offset:-2px}
.tfr.dragging,.tvo.dragging{opacity:.8;z-index:8;cursor:grabbing}
.tfr .rt,.tvo .rt{opacity:.75;margin-left:6px;font-size:10px}
.tz{position:absolute;top:0;bottom:0;z-index:4;cursor:pointer;font-size:9px;color:#fff;overflow:visible;white-space:nowrap}
.tz span{position:absolute;left:2px;top:1px;pointer-events:none;text-shadow:0 0 2px #000}
.tz.ov{background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,rgba(255,255,255,.15) 3px 6px);border-left:1px solid #fff;border-right:1px solid #fff}
.tz.ov.duck{background:repeating-linear-gradient(45deg,rgba(255,183,77,.8) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.ov.mix{background:repeating-linear-gradient(45deg,rgba(229,83,75,.7) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.gap{background:rgba(0,0,0,.65);border:1px dashed var(--dim)}
.tz.cut::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.tz .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tz .h.l{left:-4px}.tz .h.r{right:-4px}
.tz .h:hover{background:rgba(78,161,255,.7)}
.tz.sel{box-shadow:0 0 0 2px #ffd54f}
.duckz{position:absolute;top:0;bottom:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(-45deg,rgba(255,183,77,.30) 0 4px,rgba(255,183,77,.08) 4px 8px);border-bottom:3px solid var(--marker)}
.dropline{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #ffd54f;z-index:9;pointer-events:none}
.tlcur{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--cursor);z-index:10;display:none;pointer-events:none}
.tvo{position:absolute;top:5px;bottom:5px;background:#7b4fa8;border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;color:#fff;cursor:grab;z-index:2;border-bottom:3px solid transparent}
.tvo.green{border-bottom-color:var(--green)}.tvo.orange{border-bottom-color:var(--orange)}.tvo.red{border-bottom-color:var(--red)}.tvo.blocked{border-bottom-color:var(--blocked)}
.tvo.ovl{box-shadow:0 0 0 2px var(--red)}
.ancl{position:absolute;top:2px;height:0;border-top:1px dashed var(--marker);z-index:1;pointer-events:none}
.ancl b{position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--marker)}
table.fr td.grip{cursor:grab;color:var(--dim);width:16px;text-align:center}
table.fr tr{cursor:pointer}
table.fr tr.sel td{background:rgba(78,161,255,.14)}
table.fr tr.dropb td{border-top:2px solid #ffd54f}table.fr tr.dropa td{border-bottom:2px solid #ffd54f}
table.vt{margin-top:6px}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin-top:6px}
.detail .drow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:5px}
.detail .df{display:flex;align-items:center;gap:4px;color:var(--dim)}
.detail .df input[type=text]{text-align:right}
.warnbox,.errbox{margin:4px 0;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid var(--orange);background:rgba(227,160,8,.14);color:var(--orange)}
.errbox{border-color:var(--red);background:rgba(229,83,75,.14);color:var(--red)}
.errbox .x{float:right;padding:0 6px}
.wlist{margin:3px 0;font-size:11px;color:var(--orange)}
.rprog{align-items:center;gap:8px;margin:3px 0;font-size:12px}
.rprog .bar,.sprog .bar{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.rprog .bar i,.sprog .bar i{display:block;height:100%;width:0;background:var(--accent)}
.rprog .pct,.sprog .pct{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.rprog .lab,.sprog .lab{color:var(--dim);white-space:nowrap}
.sprog{display:none;align-items:center;gap:8px;font-size:12px;flex:none}
button.busy{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:520px}
.modal h3{margin:0 0 8px;font-size:15px}.modal p{margin:0 0 14px;color:var(--dim)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end}
header{flex-wrap:wrap}
header #hint{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
header .chk{white-space:nowrap}
button.dirty{border-color:var(--orange);color:var(--orange)}
#missing{display:none;margin:6px 0;padding:5px 7px;border:1px solid var(--orange);border-radius:4px;background:rgba(227,160,8,.12);font-size:12px}
#missing .mh{color:var(--orange);font-weight:600}#missing .mi{padding-left:8px;word-break:break-all}
.modal .box.wide{width:min(820px,94vw);max-width:none;max-height:88vh;overflow:auto}
.modal .phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.modal .phead h3{margin:0;flex:1}
.modal h4{margin:12px 0 4px;font-size:13px}
.modal textarea{background:#0f1216;border:1px solid var(--line);border-radius:4px;color:var(--text);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:6px}
.cmsg{margin:4px 0;font-size:12px}.cmsg.ok{color:var(--green)}.cmsg.warn{color:var(--orange)}
.aiprev ol,.aires ol{margin:4px 0;padding-left:24px}.aiprev li,.aires li{margin:2px 0}
.aires li.ok{color:var(--green)}.aires li.bad{color:var(--red)}.aires li.dim{color:var(--dim)}
.okbox{margin:4px 0;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid var(--green);background:rgba(63,185,80,.14);color:var(--green)}
.stlist{list-style:none;margin:6px 0;padding:0;font-size:12px}.stlist li{margin:2px 0}.stlist li.ok{color:var(--green)}.stlist li.bad{color:var(--red)}
.help div{margin:3px 0}
@keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}
.bar.indet i{width:40%!important;animation:indet 1.1s linear infinite}
.sprog .bar.indet{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.sprog .bar.indet i{display:block;height:100%;background:var(--accent)}
#tip{position:fixed;display:none;z-index:300;max-width:300px;padding:5px 9px;background:#0b0e12;color:var(--text);border:1px solid var(--accent2);border-radius:5px;font-size:12px;line-height:1.35;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hsec h4{margin:16px 0 4px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:3px}.hsec h5{margin:10px 0 2px;font-size:12px;color:var(--dim)}
.hul{margin:4px 0;padding-left:20px}.hul li{margin:3px 0}.hp{margin:4px 0}
.hsec code{background:#0f1216;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:12px}
.rrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0}
.rrow .lbl{color:var(--dim)}
.meter{position:relative;width:220px;height:12px;background:#0f1216;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.meter.off{opacity:.35}
.meter .rms{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--green) 0,var(--green) 75%,var(--orange) 85%,var(--red) 100%);background-size:220px 100%}
.meter .pk{position:absolute;top:0;bottom:0;width:2px;left:0;background:#fff}
.meter .tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.55)}
.mdb{width:64px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
.clip{padding:0 6px;border-radius:3px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.clip.on{background:var(--red);border-color:var(--red);color:#fff}
.rstat{font-variant-numeric:tabular-nums;min-width:120px}
.rstat.live{color:var(--red);font-weight:600}
button.rec{color:#ff6b6b}
button.rec.on{background:#8a2020;border-color:var(--red);color:#fff}
table.takes td .on{margin-left:2px}
</style>
</head>
<body>
<header>
  <h1>Audio Fit Tool <small id="ver"></small></h1>
  <button id="btnLoad" title="Audiobestanden laden">Laden</button>
  <input id="file" type="file" accept="audio/*,.wav,.mp3" multiple hidden>
  <button id="btnUndo" title="Ongedaan maken (Ctrl+Z)">&#8630;</button>
  <button id="btnRedo" title="Opnieuw (Ctrl+Y)">&#8631;</button>
  <button id="btnRecipe" title="Recept opslaan of laden">Recept &#8645;</button>
  <input id="recFile" type="file" accept=".json,application/json" hidden>
  <button id="btnAI" title="Claude aansturen via kopieren en plakken">AI &#8645;</button>
  <button id="btnRec" class="rec" title="Voice-over opnemen terwijl een blok speelt (met koptelefoon)">&#9679; Opname</button>
  <span class="sp"></span>
  <label class="chk" title="Piek van elk geexporteerd blok naar -1 dBFS"><input type="checkbox" id="chkNorm"> normaliseer (&minus;1 dBFS)</label>
  <button id="btnExportAll" title="Alle blokken achter elkaar als losse WAV-downloads">Alle blokken exporteren</button>
  <button id="btnHelp" title="Hulp, sneltoetsen en zelftest">?</button>
</header>
<main>
  <div class="top">
    <div class="side left"><h2>Bronnen</h2><div id="missing"></div><div id="sources"></div></div>
    <div class="center">
      <div class="wavewrap" id="wavewrap">
        <canvas id="cv"></canvas>
        <div class="drop" id="dropmsg">Geen audio geladen.</div>
        <input type="text" id="mname" placeholder="naam">
      </div>
      <input type="range" id="scroll" min="0" max="1000" value="0" step="1">
      <div class="ctrl">
        <div class="grp"><label>in</label><input class="tf" type="text" id="fIn">
          <span class="nud"><button data-f="in" data-d="-10">-10</button><button data-f="in" data-d="-1">-1</button><button data-f="in" data-d="1">+1</button><button data-f="in" data-d="10">+10</button></span></div>
        <div class="grp"><label>uit</label><input class="tf" type="text" id="fOut">
          <span class="nud"><button data-f="out" data-d="-10">-10</button><button data-f="out" data-d="-1">-1</button><button data-f="out" data-d="1">+1</button><button data-f="out" data-d="10">+10</button></span></div>
        <div class="grp"><label>duur</label><input class="tf" type="text" id="fDur"></div>
        <div class="grp"><label>cursor</label><span id="curtxt" class="tf" style="display:inline-block">0:00.000</span></div>
      </div>
      <div class="ctrl" style="border-top:none">
        <button id="btnPlay">&#9654; Afspelen</button>
        <label class="chk"><input type="checkbox" id="chkLoop"> loop (L)</label>
        <label class="chk"><input type="checkbox" id="chkLast2"> alleen laatste 2 s</label>
        <label class="chk"><input type="checkbox" id="chkSnap" checked> snap nuldoorgang</label>
        <button id="btnMarker">M marker</button>
        <button id="btnToBlock">&rarr; blok (Enter)</button>
        <button id="btnToVoice" title="Selectie als stemfragment in het actieve blok (Shift+Enter)">&rarr; stem (Shift+Enter)</button>
        <label>anker</label><select id="vAnchor" title="Muziekfragment waaraan de stem hangt"></select>
        <label>offset</label><input class="tf" type="text" id="vOffset" value="0.000" style="width:64px" title="Seconden na het begin van het anker"><span class="dim">s</span>
        <button id="btnFit">Hele bron</button>
      </div>
    </div>
    <div class="side right">
      <h2>Markers</h2><div id="markers"></div>
      <div class="between">
        <h2>Selecteer tussen markers</h2>
        <select id="selA"></select><select id="selB"></select>
        <button id="btnBetween">Selecteer</button>
      </div>
    </div>
  </div>
  <div class="blocks">
    <div class="bar"><h2 style="margin:0">Blokken</h2>
      <input type="text" id="nbName" placeholder="Bloknaam" style="width:140px">
      <input type="text" id="nbDur" value="15.000" style="width:70px;text-align:right" title="Doelduur in seconden">
      <span class="dim">s</span>
      <button id="btnNewBlock">+ nieuw blok</button>
    </div>
    <div id="blocklist"></div>
  </div>
</main>
<footer>
  <div id="log"></div>
  <div class="sprog" id="sprog"><div class="bar"><i></i></div><span class="pct"></span><span class="lab"></span></div>
  <div id="status" title="Klik voor het logboek">Klaar.</div>
</footer>
<div id="ctx"></div>
<div class="modal" id="panel"><div class="box wide"><div class="phead"><h3></h3><button id="panelClose">Sluiten</button></div><div class="pbody"></div></div></div>
<div class="modal" id="modal"><div class="box"><h3></h3><p></p><div class="btns"></div></div></div>

<script id="audiofit-core">
var AudioFit = (function () {
  'use strict';

  /* =====================================================================
   * Audio Fit Tool — kern (DOM-vrij)
   * Ontwerp: docs/ontwerpplan-audio-fit-tool.md (v0.5), contract: docs/CONTRACT.md
   * (incl. "Aanvulling fase 2": stemspoor, ducking, renderBlockPure).
   * Geen DOM- of browser-API's; geen modules of afhankelijkheden.
   * ===================================================================== */

  var VERSION = '0.3.0';

  /* ---------------------------------------------------------------------
   * CONSTANTEN (§6.5, §6.6, §7) — richtwaarden (HYPOTHESE) bij elkaar,
   * zodat ze na een luistertest zijn bij te stellen.
   * ------------------------------------------------------------------- */
  var CONSTANTS = {
    RECIPE_VERSION: 2,

  /* =====================================================================
   * Opzoeken (puur, op een recept)

    if (byName.length === 1) return byName[0];
    var list = recipe.blocks.map(function (b) { return b.id + ' (' + b.name + ')'; });

  }

      Store.listeners.slice().forEach(function (fn) { try { fn(snap); } catch (e) { /* luisteraarsfouten negeren */ } });
    }
    // Runtime-audio is geen onderdeel van undo: na het terugzetten van een
    // snapshot worden geladen bronnen (en de werkfrequentie) weer bijgewerkt.
    function reconcile(recipe) {
      recipe.sampleRate = Store.recipe ? Store.recipe.sampleRate : recipe.sampleRate;
      audioNames().forEach(function (name) {
        var a = Store.audio[name];
        var dur = roundT(a.channels[0].length / a.sampleRate);
        var s = findSourceIn(recipe, name);
        if (!s) recipe.sources.push({ name: name, duration: dur, channels: a.channels.length, markers: [] });
        else { s.duration = dur; s.channels = a.channels.length; }
      });
      return recipe;
    }
    function bumpCounters(recipe) {
      recipe.blocks.forEach(function (b) {
        var mb = /^b(\d+)$/.exec(b.id); if (mb) Store.counters.b = Math.max(Store.counters.b, +mb[1]);
        b.fragments.forEach(function (f) { var mf = /^f(\d+)$/.exec(f.id); if (mf) Store.counters.f = Math.max(Store.counters.f, +mf[1]); });
        (b.voice || []).forEach(function (v) { var mv = /^v(\d+)$/.exec(v.id); if (mv) Store.counters.v = Math.max(Store.counters.v, +mv[1]); });
      });
    }
    function nextId(kind, recipe) {
      bumpCounters(recipe);
      Store.counters[kind]++;
      return kind + Store.counters[kind];
    }
    function commit(beforeJSON, newRecipe) {
      Store.undo.push(beforeJSON);
      if (Store.undo.length > CONSTANTS.UNDO_MAX) Store.undo.shift();
      Store.redo = [];
      Store.recipe = newRecipe;
      notify();
    }

    /* ------------------------------ Cutter ----------------------------- */
    function findSourceIn(recipe, name) {
      for (var i = 0; i < recipe.sources.length; i++) if (recipe.sources[i].name === name) return recipe.sources[i];
      return null;
    }
    function getSource(recipe, name) {
      var s = findSourceIn(recipe, name);
      if (!s) {
        var names = recipe.sources.map(function (x) { return x.name; });
        fail('bron ' + q(name) + ' bestaat niet; ' + (names.length ? 'bekende bronnen: ' + names.join(', ') : 'er zijn nog geen bronnen geladen'));
      }
      return s;
    }
    function markerList(src) {
      if (!src.markers.length) return 'deze bron heeft nog geen markers';
      return 'bestaande markers: ' + src.markers.map(function (m) { return '@' + m.name + ' (' + fmt(m.time) + ' s)'; }).join(', ');
    }
    // Zet een getal of "@marker" om naar seconden en controleert het bereik.
    function resolveTime(src, value, argName) {
      var t;
      if (typeof value === 'string') {
        if (value.charAt(0) !== '@') fail(argName + ' moet een getal (seconden) of "@markernaam" zijn; kreeg ' + q(value));
        var nm = value.slice(1), mk = null;
        for (var i = 0; i < src.markers.length; i++) if (src.markers[i].name === nm) { mk = src.markers[i]; break; }
        if (!mk) fail('marker ' + q(value) + ' bestaat niet in ' + src.name + '; ' + markerList(src));
        t = mk.time;
      } else if (typeof value === 'number' && isFinite(value)) t = value;
      else fail(argName + ' moet een getal (seconden) of "@markernaam" zijn');
      if (t < 0) fail(argName + ' ' + fmt(t) + ' ligt vóór het begin van ' + src.name + ' (0 s)');
      if (t > src.duration + 1e-9) fail(argName + ' ' + fmt(t) + ' ligt voorbij het einde van ' + src.name + ' (' + fmt(src.duration) + ' s)');
      return t;
    }
    function snapToZero(sourceName, timeSec) {
      var a = Store.audio[sourceName];
      if (!a || typeof timeSec !== 'number' || !isFinite(timeSec)) return timeSec;
      var sr = a.sampleRate, ch = a.channels, C = ch.length, len = ch[0].length;
      var n0 = Math.round(timeSec * sr), W = Math.round(CONSTANTS.SNAP_WINDOW_MS / 1000 * sr);
      if (n0 < 0 || n0 > len) return timeSec;
      function mono(n) { var s = 0; for (var c = 0; c < C; c++) s += ch[c][n]; return s; }
      function crossAt(n) { // tekenwissel tussen n-1 en n
        if (n < 1 || n >= len) return -1;
        var x0 = mono(n - 1), x1 = mono(n);
        if ((x0 < 0 && x1 >= 0) || (x0 > 0 && x1 <= 0) || x0 === 0) return Math.abs(x1) < Math.abs(x0) ? n : n - 1;
        return -1;
      }
      for (var dd = 0; dd <= W; dd++) {
        var hit = crossAt(n0 + dd);
        if (hit < 0 && dd > 0) hit = crossAt(n0 - dd + 1);
        if (hit >= 0) return roundT(hit / sr);
      }
      return timeSec;
    }

    /* --------------------------- Opzoekhulpen -------------------------- */
    var getBlock = findBlock;
    function getFragment(recipe, id) {
      for (var i = 0; i < recipe.blocks.length; i++) {
        var b = recipe.blocks[i];
        for (var j = 0; j < b.fragments.length; j++) if (b.fragments[j].id === id) return { block: b, index: j, fragment: b.fragments[j] };
      }
      var list = [];
      recipe.blocks.forEach(function (b) { b.fragments.forEach(function (f) { list.push(f.id + ' (' + b.name + ')'); }); });
      fail('fragment ' + q(id) + ' bestaat niet; ' + (list.length ? 'bestaande fragmenten: ' + list.join(', ') : 'er zijn nog geen fragmenten'));
    }
    function insertFragment(recipe, block, frag, position) {
      var len = block.fragments.length;
      var p = (position == null) ? len : position;
      if (p < 0 || p > len) fail('position ' + p + ' ligt buiten het blok; kies 0 t/m ' + len);
      block.fragments.splice(p, 0, frag);
      if (len >= 1) block.transitions.splice(Math.min(p, len - 1), 0, Validator.defaultTransition(recipe.defaults));

    }
    function removeFragmentAt(block, idx) {
      var len = block.fragments.length;

      if (len > 1) block.transitions.splice(idx === 0 ? 0 : idx - 1, 1);
    }
    function checkFragmentSpan(src, tin, tout) {
      if (!(tout > tin)) fail('in (' + fmt(tin) + ') moet vóór out (' + fmt(tout) + ') liggen');
      var durMs = (tout - tin) * 1000;
      if (durMs < CONSTANTS.MIN_FRAGMENT_MS - 1e-9) fail('fragment is ' + (Math.round(durMs * 10) / 10) + ' ms lang; minimaal ' + CONSTANTS.MIN_FRAGMENT_MS + ' ms');
    }
    function getVoice(recipe, id) {
      for (var i = 0; i < recipe.blocks.length; i++) {
        var b = recipe.blocks[i], vs = b.voice || [];
        for (var j = 0; j < vs.length; j++) if (vs[j].id === id) return { block: b, index: j, voice: vs[j] };
      }
      var list = [];
      recipe.blocks.forEach(function (b) { (b.voice || []).forEach(function (v) { list.push(v.id + ' (' + b.name + ')'); }); });
      fail('stem ' + q(id) + ' bestaat niet; ' + (list.length ? 'bestaande stemfragmenten: ' + list.join(', ') : 'er zijn nog geen stemfragmenten; voeg er een toe met add_voice'));
    }
    function checkAnchor(block, anchor) {
      var ids = block.fragments.map(function (f) { return f.id; });
      if (ids.indexOf(anchor) < 0) {
        fail('anker ' + q(anchor) + ' is geen muziekfragment van blok ' + q(block.name) + ' (' + block.id + '); ' +
          (ids.length ? 'kies uit: ' + ids.join(', ') : 'voeg eerst een muziekfragment toe met add_fragment'));
      }
    }
    function voicesOnAnchor(block, fragId) {
      return (block.voice || []).filter(function (v) { return v.anchor === fragId; }).map(function (v) { return v.id; });
    }
    // Resultaat van add_voice/update_voice: { id, in, out, start, end } (+ warnings over deze stem, indien aanwezig).
    function voiceResult(block, v) {
      var rep = computeFit(block), e = null;
      rep.voice.forEach(function (x) { if (x.id === v.id) e = x; });
      var res = { id: v.id, 'in': v['in'], out: v.out, start: e ? e.start : null, end: e ? e.end : null };
      var re = new RegExp('\\b' + v.id + '\\b');
      var w = rep.ok ? rep.warnings.filter(function (x) { return re.test(x); }) : [rep.error];
      if (w.length) res.warnings = w;

    }

    /* ----------------------------- Renderer ---------------------------- */
    // Zelfde pure Renderer als renderBlockPure; hier met de cache en audio van de instantie.
    var renderCache = new Map();
    var rendered = {};
    function renderBlock(recipe, block, onProgress) {
      var r = Renderer.render(recipe, Store.audio, block, { cache: renderCache, onProgress: onProgress });
      rendered[block.id] = { sampleRate: r.sampleRate, channels: r.channels };
      return { block: block.id, duration: r.stats.duration, samples: r.stats.samples, channels: r.channels.length,
        peakDb: r.stats.peakDb, peak: r.peak, clipped: r.stats.clipped, warnings: r.warnings };
    }

    /* ----------------------------- Commands ---------------------------- */
    var T_TIME = { type: ['number', 'string'], description: 'seconden of "@markernaam"' };
    var T_REF = { type: 'string', minLength: 1 };
    var T_OFFSET = { type: 'number', description: 'seconden na het begin van het anker in de uitvoer (mag negatief)' };
    var T_VTD = { type: ['number', 'null'], exclusiveMinimum: 0, description: 'doelduur van de stem in seconden; null = oorspronkelijke snelheid' };
    var T_DUCKDB = { type: 'number', maximum: 0, description: 'ducking van de muziek onder de stem in dB (≤ 0; 0 = uit)' };
    var T_DUCKMS = { type: 'number', minimum: 0, maximum: CONSTANTS.VOICE_DUCK_MAX_MS, description: 'duur van de ducking-hellingen in ms' };
    function obj(props, required) { return { type: 'object', properties: props, required: required || [], additionalProperties: false }; }

    var commands = [
      { name: 'get_state', description: 'Geeft het volledige recept (zonder audiodata).', schema: obj({}),
        run: function (a, ctx) { return clone(ctx.recipe); } },

      { name: 'list_sources', description: 'Bronnen met duur, kanalen, markers en of de audio geladen is.', schema: obj({}),
        run: function (a, ctx) {
          return ctx.recipe.sources.map(function (s) {
            return { name: s.name, duration: s.duration, channels: s.channels, loaded: !!Store.audio[s.name], markers: clone(s.markers) };
          });
        } },

      { name: 'add_marker', description: 'Plaatst een benoemde marker in een bron. Lege naam → m1, m2, …',
        schema: obj({ source: T_REF, name: { type: 'string', description: 'markernaam (uniek per bron)' }, time: T_TIME }, ['source', 'time']),
        run: function (a, ctx) {

          var name = (a.name || '').replace(/^@/, '').trim();
          if (!name) { var k = 1; while (s.markers.some(function (m) { return m.name === 'm' + k; })) k++; name = 'm' + k; }
          if (s.markers.some(function (m) { return m.name === name; })) fail('marker ' + q(name) + ' bestaat al in ' + s.name + '; kies een andere naam of gebruik update_marker; ' + markerList(s));
          s.markers.push({ name: name, time: t });
          s.markers.sort(function (x, y) { return x.time - y.time; });
          return { name: name, time: t };
        } },

      { name: 'update_marker', description: 'Hernoemt en/of verplaatst een marker. Bestaande fragmenten veranderen niet.',
        schema: obj({ source: T_REF, name: T_REF, newName: { type: 'string', minLength: 1 }, time: T_TIME }, ['source', 'name']),
        run: function (a, ctx) {

          s.markers.forEach(function (m) { if (m.name === nm) mk = m; });
          if (!mk) fail('marker ' + q('@' + nm) + ' bestaat niet in ' + s.name + '; ' + markerList(s));
          if (a.time !== undefined) mk.time = roundT(resolveTime(s, a.time, 'time'));

            if (!nn) fail('newName mag niet leeg zijn');

            mk.name = nn;

          s.markers.sort(function (x, y) { return x.time - y.time; });

        } },

      { name: 'delete_marker', description: 'Verwijdert een marker. Bestaande fragmenten veranderen niet.',
        schema: obj({ source: T_REF, name: T_REF }, ['source', 'name']),
        run: function (a, ctx) {
          var s = getSource(ctx.recipe, a.source), nm = a.name.replace(/^@/, '');
          var idx = -1; s.markers.forEach(function (m, i) { if (m.name === nm) idx = i; });
          if (idx < 0) fail('marker ' + q('@' + nm) + ' bestaat niet in ' + s.name + '; ' + markerList(s));
          s.markers.splice(idx, 1);
          return null;
        } },

      { name: 'create_block', description: 'Maakt een nieuw blok met een doelduur in seconden (3 decimalen). Standaard fitMode "manual": fragmenten houden hun originele lengte (manualDuration null) tot je ze rekt; geef fitMode "proportional" om alles automatisch gelijk te rekken tot de doelduur.',
        schema: obj({ name: { type: 'string' }, targetDuration: { type: 'number', exclusiveMinimum: 0, description: 'seconden' },
          fitMode: { type: 'string', 'enum': CONSTANTS.FIT_MODES }, duckDb: T_DUCKDB, duckMs: T_DUCKMS }, []),
        run: function (a, ctx) {
          var id = nextId('b', ctx.recipe);
          var td = a.targetDuration !== undefined ? a.targetDuration : ctx.recipe.defaults.blockDuration;
          var b = { id: id, name: a.name || ('Blok ' + (ctx.recipe.blocks.length + 1)), targetDuration: Math.round(td * 1000) / 1000,
            fitMode: a.fitMode || CONSTANTS.DEFAULT_FIT_MODE_NEW_BLOCK, duckDb: a.duckDb !== undefined ? a.duckDb : CONSTANTS.VOICE_DUCK_DEFAULT_DB,
            duckMs: a.duckMs !== undefined ? a.duckMs : CONSTANTS.VOICE_DUCK_DEFAULT_MS, fragments: [], transitions: [], voice: [] };

      { name: 'update_block', description: 'Wijzigt naam, doelduur, fit-modus of ducking (duckDb ≤ 0, 0 = uit; duckMs) van een blok.',
        schema: obj({ block: T_REF, name: { type: 'string' }, targetDuration: { type: 'number', exclusiveMinimum: 0 },

          if (a.targetDuration !== undefined) { var td = Math.round(a.targetDuration * 1000) / 1000; if (!(td > 0)) fail('targetDuration moet groter dan 0 zijn'); b.targetDuration = td; }
          if (a.fitMode !== undefined) b.fitMode = a.fitMode;
          if (a.duckDb !== undefined) b.duckDb = a.duckDb;

      { name: 'delete_block', description: 'Verwijdert een blok met zijn fragmenten en stemfragmenten.', schema: obj({ block: T_REF }, ['block']),

      { name: 'add_fragment', description: 'Voegt een fragment (bron + in/uit) toe aan een blok. in/out: seconden of "@marker". Snap naar nuldoorgang standaard aan.',
        schema: obj({ block: T_REF, source: T_REF, 'in': T_TIME, out: T_TIME, position: { type: 'integer', minimum: 0 },
          snap: { type: 'boolean' }, mode: { type: 'string', 'enum': CONSTANTS.MODES }, preset: { type: 'string', 'enum': CONSTANTS.PRESETS },
          gainDb: { type: 'number' }, fadeInMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS },
          fadeOutMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS }, locked: { type: 'boolean' },
          manualDuration: { type: ['number', 'null'], exclusiveMinimum: 0 } }, ['block', 'source', 'in', 'out']),
        run: function (a, ctx) {
          var r = ctx.recipe, b = getBlock(r, a.block), s = getSource(r, a.source);
          var tin = resolveTime(s, a['in'], 'in'), tout = resolveTime(s, a.out, 'out');

          tin = roundT(tin); tout = roundT(tout);
          checkFragmentSpan(s, tin, tout);
          var f = { id: nextId('f', r), source: s.name, 'in': tin, out: tout, mode: a.mode || 'pitch', preset: a.preset || 'music',

        } },

      { name: 'update_fragment', description: 'Wijzigt instellingen van een fragment (in/out met snap, modus, preset, gain, fades, vergrendeling, handmatige duur).',
        schema: obj({ fragment: T_REF, 'in': T_TIME, out: T_TIME, snap: { type: 'boolean' }, mode: { type: 'string', 'enum': CONSTANTS.MODES },
          preset: { type: 'string', 'enum': CONSTANTS.PRESETS }, gainDb: { type: 'number' },
          fadeInMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS }, fadeOutMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS },
          locked: { type: 'boolean' }, manualDuration: { type: ['number', 'null'], exclusiveMinimum: 0 } }, ['fragment']),
        run: function (a, ctx) {
          var loc = getFragment(ctx.recipe, a.fragment), f = loc.fragment, s = getSource(ctx.recipe, f.source);
          var tin = f['in'], tout = f.out;

          if (a.out !== undefined) { tout = resolveTime(s, a.out, 'out'); if (a.snap !== false) tout = snapToZero(s.name, tout); tout = roundT(tout); }
          checkFragmentSpan(s, tin, tout);

      { name: 'move_fragment', description: 'Verplaatst een fragment naar een andere positie (optioneel in een ander blok).',

        run: function (a, ctx) {

          }
          removeFragmentAt(loc.block, loc.index);
          insertFragment(r, dest, loc.fragment, a.position);

        } },

      { name: 'duplicate_fragment', description: 'Dupliceert een fragment direct erachter.', schema: obj({ fragment: T_REF }, ['fragment']),

      { name: 'delete_fragment', description: 'Verwijdert een muziekfragment (en de bijbehorende overgang). Geweigerd als het fragment anker van een stem is.',

      { name: 'add_voice', description: 'Voegt een stemfragment (voice-over) toe dat bovenop de muziek klinkt. Start in het blok = uitvoerstart van het anker (muziekfragment-id) + offset (s, mag negatief); schuift mee met de fit. targetDuration null = oorspronkelijke snelheid. Resultaat: id, werkelijke in/uit, start/end in het blok.',
        schema: obj({ block: T_REF, source: T_REF, 'in': T_TIME, out: T_TIME, anchor: { type: 'string', minLength: 1, description: 'id van een muziekfragment in dit blok' },
          offset: T_OFFSET, targetDuration: T_VTD, snap: { type: 'boolean' },
          preset: { type: 'string', 'enum': CONSTANTS.PRESETS }, mode: { type: 'string', 'enum': CONSTANTS.MODES }, gainDb: { type: 'number' },
          fadeInMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS }, fadeOutMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS },
          acceptOverlap: { type: 'boolean' } }, ['block', 'source', 'in', 'out', 'anchor']),
        run: function (a, ctx) {
          var r = ctx.recipe, b = getBlock(r, a.block), s = getSource(r, a.source);
          checkAnchor(b, a.anchor);
          var tin = resolveTime(s, a['in'], 'in'), tout = resolveTime(s, a.out, 'out');
          if (a.snap !== false) { tin = snapToZero(s.name, tin); tout = snapToZero(s.name, tout); }
          tin = roundT(tin); tout = roundT(tout);
          checkFragmentSpan(s, tin, tout);
          var v = { id: nextId('v', r), source: s.name, 'in': tin, out: tout, anchor: a.anchor, offset: roundT(a.offset || 0),
            targetDuration: a.targetDuration != null ? roundT(a.targetDuration) : null,
            mode: a.mode || 'pitch', preset: a.preset || CONSTANTS.VOICE_DEFAULT_PRESET, gainDb: a.gainDb || 0,
            fadeInMs: a.fadeInMs !== undefined ? a.fadeInMs : r.defaults.fadeMs, fadeOutMs: a.fadeOutMs !== undefined ? a.fadeOutMs : r.defaults.fadeMs,
            acceptOverlap: !!a.acceptOverlap };
          if (!b.voice) b.voice = [];
          b.voice.push(v);
          return voiceResult(b, v);
        } },

      { name: 'update_voice', description: 'Wijzigt een stemfragment: in/out (met snap), anchor, offset, targetDuration (null = oorspronkelijke snelheid), acceptOverlap, gain, fades, preset, mode.',
        schema: obj({ voice: T_REF, 'in': T_TIME, out: T_TIME, snap: { type: 'boolean' }, anchor: { type: 'string', minLength: 1 }, offset: T_OFFSET,
          targetDuration: T_VTD, acceptOverlap: { type: 'boolean' }, gainDb: { type: 'number' },
          fadeInMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS }, fadeOutMs: { type: 'number', minimum: 0, maximum: CONSTANTS.FADE_MAX_MS },
          preset: { type: 'string', 'enum': CONSTANTS.PRESETS }, mode: { type: 'string', 'enum': CONSTANTS.MODES } }, ['voice']),
        run: function (a, ctx) {

          if (a.out !== undefined) { tout = resolveTime(s, a.out, 'out'); if (a.snap !== false) tout = snapToZero(s.name, tout); tout = roundT(tout); }

          ['acceptOverlap', 'gainDb', 'fadeInMs', 'fadeOutMs', 'preset', 'mode'].forEach(function (k) { if (a[k] !== undefined) v[k] = a[k]; });

      { name: 'delete_voice', description: 'Verwijdert een stemfragment.', schema: obj({ voice: T_REF }, ['voice']),

      { name: 'set_transition', description: 'Stelt de overgang in tussen fragment index en index+1: type, ms (overlap of stilte), curve, duckDb.',
        schema: obj({ block: T_REF, index: { type: 'integer', minimum: 0 }, type: { type: 'string', 'enum': CONSTANTS.TRANSITION_TYPES },
          ms: { type: 'number', minimum: 0 }, curve: { type: 'string', 'enum': CONSTANTS.CURVES }, duckDb: { type: 'number', maximum: 0 } }, ['block', 'index', 'type']),
        run: function (a, ctx) {

          var nT = b.transitions.length;
          if (!nT) fail('blok ' + q(b.name) + ' heeft ' + b.fragments.length + ' fragment(en) en dus nog geen overgangen');
          if (a.index >= nT) fail('index ' + a.index + ' bestaat niet; blok ' + q(b.name) + ' heeft overgangen 0 t/m ' + (nT - 1));
          var old = b.transitions[a.index];
          var t = Validator.defaultTransition(r.defaults, a.type);
          if (old && old.type === a.type) { t = clone(old); }
          else if (old && a.type !== 'cut' && typeof old.ms === 'number' && old.ms > 0 && (isOverlapType(a.type) === isOverlapType(old.type))) t.ms = old.ms;
          if (a.ms !== undefined) { if (a.type === 'cut' && a.ms !== 0) fail('type cut heeft geen duur; laat ms weg of kies gap/crossfade'); t.ms = a.ms; }
          if (a.curve !== undefined) { if (a.type === 'cut' || a.type === 'gap') fail('curve geldt alleen voor overlappende overgangen, niet voor ' + a.type); t.curve = a.curve; }
          if (a.duckDb !== undefined) { if (a.type !== 'duck') fail('duckDb geldt alleen voor type duck'); t.duckDb = a.duckDb; }

      { name: 'fit_report', description: 'Fit-rapport: per fragment brondur, doeldur, ratio, status en start/end in het blok; per overgang start/end; stemmen (voice), ducking-zones (duck), stem-overlaps; per blok of het klopt of de afwijking.',
        schema: obj({ block: T_REF }, []),

      { name: 'render_block', description: 'Rendert een blok (fit + stretch + overgangen + stemspoor met ducking). Resultaat: duur, samples, piek in dBFS, clipping.',
        schema: obj({ block: T_REF }, ['block']),
        run: function (a, ctx) {

      { name: 'export_block', description: 'Rendert en codeert blok(ken) als 16-bit WAV. Leeg = alle blokken. normalize: piek naar −1 dBFS.',
        schema: obj({ block: T_REF, normalize: { type: 'boolean' } }, []),
        run: function (a, ctx) {

          if (!blocks.length) fail('er zijn nog geen blokken om te exporteren');
          var files = [], warnings = [];
          blocks.forEach(function (b) {

            if (a.normalize && r.peak > 0) {
              var gn = dbToLin(CONSTANTS.NORMALIZE_PEAK_DB) / r.peak;
              chans = chans.map(function (ch) { var o = new Float32Array(ch.length); for (var i = 0; i < ch.length; i++) o[i] = ch[i] * gn; return o; });

            files.push({ name: name, bytes: WavCodec.encode(chans, ctx.recipe.sampleRate), block: b.id, samples: r.samples,
              peakDb: a.normalize && r.peak > 0 ? CONSTANTS.NORMALIZE_PEAK_DB : r.peakDb, clipped: !a.normalize && r.clipped });

      { name: 'import_recipe', description: 'Vervangt het project door een recept (object of JSON-tekst). Resultaat: aantal blokken en ontbrekende bronnen.',
        schema: obj({ recipe: { type: ['object', 'string'] } }, ['recipe']),
        run: function (a, ctx) {
          var nr = Validator.normalizeRecipe(a.recipe);
          if (nr.problems.length) fail('recept bevat ' + nr.problems.length + ' probleem/problemen: ' + nr.problems.join('; '));
          var rec = nr.recipe, warnings = [];
          if (audioNames().length && rec.sampleRate !== ctx.recipe.sampleRate) {
            warnings.push('sampleRate van het recept (' + rec.sampleRate + ') wijkt af van de werkfrequentie (' + ctx.recipe.sampleRate + '); werkfrequentie aangehouden');
          }
          if (audioNames().length) rec.sampleRate = ctx.recipe.sampleRate;
          var missing = rec.sources.filter(function (s) { return !Store.audio[s.name]; }).map(function (s) { return s.name; });
          // Afwijkende duur van een al geladen bron melden (koppeling op bestandsnaam).
          rec.sources.forEach(function (s) {
            var au = Store.audio[s.name];
            if (au) { var dd = au.channels[0].length / au.sampleRate; if (Math.abs(dd - s.duration) > 0.01) warnings.push('bron ' + s.name + ': duur in recept ' + fmt(s.duration) + ' s, geladen bestand ' + fmt(dd) + ' s'); }

      { name: 'undo', description: 'Maakt de laatste wijziging ongedaan (max. ' + CONSTANTS.UNDO_MAX + ' stappen).', schema: obj({}), special: true },
      { name: 'redo', description: 'Voert de laatst ongedaan gemaakte wijziging opnieuw uit.', schema: obj({}), special: true }
    ];
    var cmdMap = {};
    commands.forEach(function (c) { cmdMap[c.name] = c; });

    function lookup(c) {
      if (!c || typeof c !== 'object' || Array.isArray(c)) fail('commando moet een object {cmd, args} zijn');
      if (typeof c.cmd !== 'string') fail('commando mist het veld cmd (tekst); beschikbaar: ' + Object.keys(cmdMap).join(', '));
      var def = cmdMap[c.cmd];
      if (!def) {
        var extra = (c.cmd === 'play' || c.cmd === 'stop') ? ' (' + c.cmd + ' bestaat alleen in de editor)' : '';
        fail('onbekend commando ' + q(c.cmd) + extra + '; beschikbaar: ' + Object.keys(cmdMap).join(', '));
      }
      var args = c.args === undefined || c.args === null ? {} : c.args;
      if (Validator.typeOf(args) !== 'object') fail('args van ' + c.cmd + ' moet een object zijn');
      Validator.check(args, def.schema, '', c.cmd);
      return { def: def, args: args };
    }

    function doHistory(kind) {
      var from = kind === 'undo' ? Store.undo : Store.redo, to = kind === 'undo' ? Store.redo : Store.undo;
      if (!from.length) fail(kind === 'undo' ? 'niets om ongedaan te maken' : 'niets om opnieuw uit te voeren');
      to.push(JSON.stringify(Store.recipe));
      if (to.length > CONSTANTS.UNDO_MAX) to.shift();
      Store.recipe = reconcile(JSON.parse(from.pop()));
      bumpCounters(Store.recipe);
      notify();
      return { undo: Store.undo.length, redo: Store.redo.length };
    }

    function exec(c) {
      try {
        var L = lookup(c);
        if (L.def.special) return { ok: true, result: doHistory(L.def.name) };
        var before = JSON.stringify(Store.recipe);
        var ctx = { recipe: JSON.parse(before) };
        var result = L.def.run(L.args, ctx);
        var after = JSON.stringify(ctx.recipe);
        if (after !== before) commit(before, ctx.recipe);
        return { ok: true, result: result === undefined ? null : result };
      } catch (e) {
        return { ok: false, error: e && e.afUser ? e.message : 'Interne fout: ' + msg(e) };

    function execAll(list) {

        var before = JSON.stringify(Store.recipe);
        var ctx = { recipe: JSON.parse(before) };
        for (var i = 0; i < list.length; i++) {
          try {
            var L = lookup(list[i]);
            if (L.def.special) fail(L.def.name + ' kan niet binnen een reeks (execAll); voer het los uit');
            var r = L.def.run(L.args, ctx);

          }

        if (after !== before) commit(before, ctx.recipe);

      } catch (e2) {

    }

    function describe() {

    }

    /* --------------------------- Runtime-audio -------------------------- */
    function attachAudio(name, audio, opts) {
      opts = opts || {};
      if (typeof name !== 'string' || !name) throw userError('attachAudio: naam ontbreekt');
      if (!audio || !Array.isArray(audio.channels) || !audio.channels.length) throw userError('attachAudio(' + name + '): channels moet een niet-lege lijst Float32Array zijn');
      if (!(audio.sampleRate > 0)) throw userError('attachAudio(' + name + '): sampleRate ontbreekt');
      var chans = audio.channels.map(function (ch) { return ch instanceof Float32Array ? ch : Float32Array.from(ch); });
      var len = chans[0].length;
      chans.forEach(function (ch) { if (ch.length !== len) throw userError('attachAudio(' + name + '): kanalen zijn niet even lang'); });
      if (!len) throw userError('attachAudio(' + name + '): bestand bevat geen samples');
      var used = name;
      if (opts.rename && Store.audio[name]) { var k = 2; while (Store.audio[name + ' (' + k + ')'] || findSourceIn(Store.recipe, name + ' (' + k + ')')) k++; used = name + ' (' + k + ')'; }
      var sr = Store.recipe.sampleRate;
      if (audio.sampleRate !== sr) chans = Resampler.resample(chans, Math.round(len * sr / audio.sampleRate));
      Store.audio[used] = { sampleRate: sr, channels: chans, version: ++Store.audioVersion };
      reconcile(Store.recipe);

    }
    function detachAudio(name) { if (Store.audio[name]) { delete Store.audio[name]; notify(); return true; } return false; }
    function getAudio(name) { var a = Store.audio[name]; return a ? { sampleRate: a.sampleRate, channels: a.channels } : null; }
    function setSampleRate(sr) {
      if (!(Number.isInteger(sr) && sr >= 8000 && sr <= 384000)) throw userError('setSampleRate: verwacht een geheel getal tussen 8000 en 384000; kreeg ' + sr);
      if (sr === Store.recipe.sampleRate) return sr;
      if (audioNames().length) throw userError('setSampleRate: kan de werkfrequentie niet wijzigen naar ' + sr + ' Hz; er is al audio gekoppeld op ' + Store.recipe.sampleRate + ' Hz');

    function subscribe(fn) {

    /* ----------------------------- Publiek ----------------------------- */
    var api = {
      version: VERSION,
      CONSTANTS: CONSTANTS,
      exec: exec,
      execAll: execAll,
      describe: describe,
      subscribe: subscribe,
      attachAudio: attachAudio,
      detachAudio: detachAudio,
      getAudio: getAudio,

      stretchInfo: function (channels, outLength, opts) { return Stretch.run(channels, outLength, opts); },
      wsolaParams: Stretch.params,
      resample: Resampler.resample,
      ratioStatus: ratioStatus,
      create: createCore,
      selftest: selftest

    return api;
  }

  /* =====================================================================
   * Zelftest — acceptatiecriteria 2 t/m 7 (§11) met gegenereerde signalen
   * ===================================================================== */
  function selftest(opts) {
    opts = opts || {};
    var sr = opts.sampleRate || 48000;
    var checks = [];
    var t0 = Date.now();
    function check(name, fn) {
      var ts = Date.now();
      try { var r = fn(); checks.push({ name: name, ok: !!r.ok, detail: r.detail + ' [' + (Date.now() - ts) + ' ms]' }); }
      catch (e) { checks.push({ name: name, ok: false, detail: 'fout: ' + msg(e) }); }
    }
    function must(res) { if (!res.ok) throw new Error(res.error); return res; }
    function inst() { var a = createCore(); a.setSampleRate(sr); return a; }
    function musicSignal(dur, seed) {
      var rnd = mulberry32(seed || 1), n = Math.round(dur * sr);
      var L = new Float32Array(n), R = new Float32Array(n);
      for (var i = 0; i < n; i++) {
        var t = i / sr;
        var v = 0.3 * Math.sin(2 * Math.PI * 220 * t) + 0.2 * Math.sin(2 * Math.PI * 330 * t + 0.5) + 0.1 * Math.sin(2 * Math.PI * 55 * t);
        var env = 0.6 + 0.4 * Math.sin(2 * Math.PI * 2 * t);
        L[i] = env * v + 0.02 * (rnd() - 0.5);
        R[i] = env * v * 0.8 + 0.02 * (rnd() - 0.5);
      }
      return [L, R];
    }

    // Criterium 2
    check('2: 12,000 s in blok van 10,000 s → exact 10 × sampleRate samples', function () {
      var A = inst();
      A.attachAudio('st12.wav', { sampleRate: sr, channels: musicSignal(12, 2) });
      must(A.execAll([{ cmd: 'create_block', args: { name: 'B10', targetDuration: 10 } },
        { cmd: 'add_fragment', args: { block: 'b1', source: 'st12.wav', 'in': 0, out: 12, snap: false } }]));
      var ex = must(A.exec({ cmd: 'export_block', args: { block: 'b1' } })).result;
      var dec = A.wav.decode(ex.files[0].bytes);
      var ok = dec.channels[0].length === 10 * sr && dec.sampleRate === sr;
      return { ok: ok, detail: dec.channels[0].length + ' samples (verwacht ' + (10 * sr) + '), bestand ' + ex.files[0].name };
    });

    function sineFit(mode) {
      var A = inst();
      A.attachAudio('sin440.wav', { sampleRate: sr, channels: [genSine(440, 3.6, sr, 0.8)] });
      must(A.execAll([{ cmd: 'create_block', args: { name: 'S', targetDuration: 3.0 } },
        { cmd: 'add_fragment', args: { block: 'b1', source: 'sin440.wav', 'in': 0, out: 3.6, snap: false, mode: mode } }]));
      var rep = must(A.exec({ cmd: 'fit_report', args: { block: 'b1' } })).result[0];
      must(A.exec({ cmd: 'render_block', args: { block: 'b1' } }));
      var y = A.getRendered('b1').channels[0];
      return { f: measureFreq(y, sr, 0.2, 0.8), ratio: rep.fragments[0].ratio };
    }
    // Criterium 3
    check('3: pitch, 440 Hz bij ratio 1,2 blijft 440 Hz (±1 Hz)', function () {
      var r = sineFit('pitch');
      return { ok: Math.abs(r.f - 440) <= 1 && Math.abs(r.ratio - 1.2) < 1e-9, detail: 'gemeten ' + r.f.toFixed(3) + ' Hz, ratio ' + r.ratio.toFixed(4) };
    });
    // Criterium 4
    check('4: varispeed, 440 Hz bij ratio 1,2 → 528 Hz (±1 Hz)', function () {
      var r = sineFit('varispeed');
      return { ok: Math.abs(r.f - 528) <= 1, detail: 'gemeten ' + r.f.toFixed(3) + ' Hz, ratio ' + r.ratio.toFixed(4) };
    });
    // Criterium 5
    check('5: 3 fragmenten (17,0 s), 2 crossfades 0,5 s, blok 15 s → ratio 1,0625, exact 15,000 s', function () {
      var A = inst();
      A.attachAudio('m20.wav', { sampleRate: sr, channels: musicSignal(20, 5) });
      must(A.execAll([{ cmd: 'create_block', args: { name: 'B15', targetDuration: 15 } },
        { cmd: 'add_fragment', args: { block: 'b1', source: 'm20.wav', 'in': 0, out: 6, snap: false } },
        { cmd: 'add_fragment', args: { block: 'b1', source: 'm20.wav', 'in': 6, out: 11.5, snap: false } },
        { cmd: 'add_fragment', args: { block: 'b1', source: 'm20.wav', 'in': 11.5, out: 17, snap: false } },
        { cmd: 'set_transition', args: { block: 'b1', index: 0, type: 'crossfade', ms: 500 } },
        { cmd: 'set_transition', args: { block: 'b1', index: 1, type: 'crossfade', ms: 500 } }]));
      var rep = must(A.exec({ cmd: 'fit_report', args: { block: 'b1' } })).result[0];
      var ratios = rep.fragments.map(function (f) { return f.ratio; });
      var ratioOk = ratios.every(function (x) { return Math.abs(x - 1.0625) < 1e-9; });
      var ex = must(A.exec({ cmd: 'export_block', args: { block: 'b1' } })).result;
      var n = A.wav.decode(ex.files[0].bytes).channels[0].length;
      return { ok: ratioOk && n === 15 * sr, detail: 'ratio\'s ' + ratios.map(function (x) { return x.toFixed(6); }).join(', ') + '; ' + n + ' samples (verwacht ' + (15 * sr) + ')' };
    });
    // Criterium 6
    check('6: omhullende per overgangstype (equal_power ≈ 0,707, linear = 0,5 halverwege)', function () {
      var A = inst();
      var n1 = sr; // 1,0 s
      var one = new Float32Array(2 * sr).fill(1), zero = new Float32Array(2 * sr);
      A.attachAudio('dc.wav', { sampleRate: sr, channels: [one] });
      A.attachAudio('nul.wav', { sampleRate: sr, channels: [zero] });
      var cases = [
        { type: 'crossfade', curve: 'equal_power', a: Math.SQRT1_2, b: Math.SQRT1_2 },
        { type: 'crossfade', curve: 'linear', a: 0.5, b: 0.5 },
        { type: 'fade_out_a', a: Math.SQRT1_2, b: 1 },
        { type: 'fade_in_b', a: 1, b: Math.SQRT1_2 },
        { type: 'duck', a: dbToLin(CONSTANTS.DUCK_DEFAULT_DB), b: 1 },
        { type: 'mix', a: 1, b: 1 }
      ];
      var ovMs = 400, details = [], allOk = true;
      function env(type, curve, first) {
        var srcA = first ? 'dc.wav' : 'nul.wav', srcB = first ? 'nul.wav' : 'dc.wav';
        var T = (type === 'cut') ? 2.0 : (type === 'gap' ? 2.3 : 2.0 - ovMs / 1000);
        var cmds = [{ cmd: 'create_block', args: { name: 'E', targetDuration: T } },
          { cmd: 'add_fragment', args: { block: 'E', source: srcA, 'in': 0, out: 1, snap: false } },
          { cmd: 'add_fragment', args: { block: 'E', source: srcB, 'in': 0, out: 1, snap: false } }];
        var ta = { block: 'E', index: 0, type: type };
        if (type === 'gap') ta.ms = 300; else if (type !== 'cut') ta.ms = ovMs;
        if (curve) ta.curve = curve;
        cmds.push({ cmd: 'set_transition', args: ta });
        must(A.execAll(cmds));
        var blk = A.exec({ cmd: 'get_state' }).result.blocks.filter(function (b) { return b.name === 'E'; })[0];
        must(A.exec({ cmd: 'render_block', args: { block: blk.id } }));
        var y = A.getRendered(blk.id).channels[0];
        must(A.exec({ cmd: 'delete_block', args: { block: blk.id } }));
        return y;
      }
      cases.forEach(function (cs) {
        var ya = env(cs.type, cs.curve, true), yb = env(cs.type, cs.curve, false);
        var ovS = Math.round(ovMs / 1000 * sr), mid = n1 - ovS + ovS / 2;
        var ga = ya[mid], gb = yb[mid];
        var ok = Math.abs(ga - cs.a) < 0.005 && Math.abs(gb - cs.b) < 0.005;
        if (!ok) allOk = false;
        details.push(cs.type + (cs.curve ? '/' + cs.curve : '') + ': A=' + ga.toFixed(3) + ' B=' + gb.toFixed(3) + (ok ? '' : ' (verwacht ' + cs.a.toFixed(3) + '/' + cs.b.toFixed(3) + ')'));
      });
      // cut: microfades aan beide kanten van de las, verder vol volume

/* ---------- renderen: Worker met terugval ---------- */
var jobs = {}, queue = [], running = null, jobSeq = 0;
var wk = null, wkSent = {}, wkGotMsg = false, useWorker = (typeof Worker !== 'undefined');

var fbCache = new Map(), fbStamp = {};
var audioStamp = {}, stampN = 0;
var WORKER_TAIL = '(function(){var audio={},cache=new Map();' +
  'self.onmessage=function(e){var m=e.data;' +
  'if(m.type==="audio"){audio[m.name]={sampleRate:m.sampleRate,channels:m.channels};cache.clear();}' +
  'else if(m.type==="render"){try{var res=AudioFit.renderBlockPure(m.recipe,audio,m.blockId,{onProgress:function(f,l){self.postMessage({type:"progress",jobId:m.jobId,fraction:f,label:l});},cache:cache});' +
  'self.postMessage({type:"done",jobId:m.jobId,sampleRate:res.sampleRate,channels:res.channels,stats:res.stats,warnings:res.warnings},res.channels.map(function(c){return c.buffer;}));}' +
  'catch(err){self.postMessage({type:"error",jobId:m.jobId,message:String(err&&err.message||err)});}}};})();';

function stampOf(name) {
  var a = hasAudio(name) ? AF.getAudio(name) : null; if (!a) return 0;
  var s = audioStamp[name];
  if (!s || s.ref !== a.channels[0]) s = audioStamp[name] = { ref: a.channels[0], id: ++stampN };
  return s.id;
}
function blockSources(b) {
  var n = {}; (b.fragments || []).forEach(function (f) { n[f.source] = 1; }); (b.voice || []).forEach(function (v) { n[v.source] = 1; });
  return Object.keys(n);
}
function missingSources(b) { return blockSources(b).filter(function (n) { return !hasAudio(n); }); }
function checkSources(b) {
  var m = missingSources(b);
  if (m.length) { say('Bron(nen) niet geladen: ' + m.join(', '), 'err'); return false; }
  return true;
}
function toBuf(res) {
  var buf = ctx.createBuffer(res.channels.length, res.channels[0].length, res.sampleRate);
  for (var i = 0; i < res.channels.length; i++) buf.copyToChannel(res.channels[i], i);

}
function pause(ms) { return new Promise(function (r) { setTimeout(r, ms || 20); }); }

// o: {key, ui, ref, purpose, make(), onDone(res), label}
function startRender(o) {
  cancelJob(o.key, null, true);
  var b = o.make(); if (!b) return;
  var sig = JSON.stringify(b) + '|' + R.sampleRate + '|' + blockSources(b).map(stampOf).join(',');
  var c = renderCache[o.key];
  if (c && c.sig === sig) { try { o.onDone(c.res, true); } catch (e) { say(e.message, 'err'); } return; }
  var job = { key: o.key, id: ++jobSeq, o: o, sig: sig, fraction: 0, label: 'in de wachtrij', state: 'queued', blockJson: blockJson(o.ui) };
  jobs[o.key] = job; queue.push(job);

}
function blockJson(id) { var b = blockById(id); return b ? JSON.stringify(b) + '|' + R.sampleRate : null; }

}
function pump() {

  var recipe = clone(R); recipe.blocks = [b];

}
function getWorker() {
  if (wk) return wk;
  var core = document.getElementById('audiofit-core').textContent;
  var url = URL.createObjectURL(new Blob([core + '\n;' + WORKER_TAIL], { type: 'text/javascript' }));
  wk = new Worker(url); wkSent = {}; wkGotMsg = false;
  setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 5000);
  var me = wk;

}
function finishJob(job, res) {

  updateBusyUI();

document.addEventListener('keydown', function (e) {
  if (panelOpen() || $('modal').style.display === 'flex') return;
  var t = e.target, tag = t && t.tagName;
  var inField = tag === 'INPUT' && (t.type === 'text' || t.type === 'number') || tag === 'SELECT' || tag === 'TEXTAREA';
  if ((e.ctrlKey || e.metaKey) && !inField) {
    var k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); doRedo(); return; }
  }
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
  var v = V();
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'i': case 'I':
      if (!v) break;
      var ti = cursorNow(); if ($('chkSnap').checked) ti = zsnap(ti); ti = r3(ti);
      v.sel = { in: ti, out: v.sel ? Math.max(v.sel.out, ti) : ti }; renderFields(); draw(); break;
    case 'o': case 'O':
      if (!v) break;
      var to = cursorNow(); if ($('chkSnap').checked) to = zsnap(to); to = r3(to);
      v.sel = { in: v.sel ? Math.min(v.sel.in, to) : to, out: to }; renderFields(); draw(); break;
    case 'm': case 'M': if (v) { e.preventDefault(); addMarkerAt(cursorNow()); } break;
    case 'l': case 'L': $('chkLoop').checked = !$('chkLoop').checked; $('chkLoop').onchange(); break;
    case 'Enter': e.preventDefault(); if (e.shiftKey) addSelectionAsVoice(); else addSelectionToBlock(); break;
  }
});

function scanArrayEnd(s, i) {           // i wijst naar '['; geeft index van bijbehorende ']' of -1
  var depth = 0, inStr = false;
  for (var k = i; k < s.length; k++) {
    var c = s[k];
    if (inStr) { if (c === '\\') k++; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '[') depth++;
    else if (c === ']') { depth--; if (!depth) return k; }
  }
  return -1;
}
function extractCommands(text) {
  text = String(text || '');
  var i = -1;
  while ((i = text.indexOf('[', i + 1)) >= 0) {
    var j = scanArrayEnd(text, i);
    if (j < 0) continue;
    var arr; try { arr = JSON.parse(text.slice(i, j + 1)); } catch (e) { continue; }
    if (Array.isArray(arr) && arr.length && arr.every(function (c) { return c && typeof c === 'object' && !Array.isArray(c) && typeof c.cmd === 'string'; })) return arr;
  }
  return null;
}
function tArg(t) { return typeof t === 'number' ? fmt(t) : (t == null ? '?' : String(t)); }
function blkName(ref) {
  if (ref == null) return '?';

  return String(ref);
}

  var range = function () { return tArg(a['in']) + '\u2013' + tArg(a.out); };

    case 'get_state': return 'Recept ophalen';
    case 'list_sources': return 'Bronnen opvragen';

    case 'update_marker': return 'Marker ' + q(a.name) + ' in ' + a.source + ' wijzigen' + (a.newName ? ': nieuwe naam ' + q(a.newName) : '') + (a.time != null ? ', tijd ' + tArg(a.time) : '');
    case 'delete_marker': return 'Marker ' + q(a.name) + ' uit ' + a.source + ' verwijderen';
    case 'create_block': return 'Blok aanmaken: ' + q(a.name) + ', doelduur ' + a.targetDuration + ' s';
    case 'update_block': return 'Blok ' + blkName(a.block) + ' wijzigen: ' + ['name', 'targetDuration', 'fitMode', 'duckDb', 'duckMs'].filter(function (k) { return a[k] !== undefined; }).map(function (k) { return k + ' = ' + a[k]; }).join(', ');
    case 'delete_block': return 'Blok ' + blkName(a.block) + ' verwijderen';
    case 'add_fragment': return 'Fragment toevoegen aan ' + blkName(a.block) + ': ' + a.source + ' ' + range() + (a.position != null ? ' op positie ' + a.position : '') + (a.mode ? ' (' + a.mode + ')' : '');
    case 'update_fragment': return 'Fragment ' + a.fragment + ' wijzigen: ' + Object.keys(a).filter(function (k) { return k !== 'fragment'; }).map(function (k) { return k + ' = ' + (typeof a[k] === 'number' && (k === 'in' || k === 'out') ? tArg(a[k]) : a[k]); }).join(', ');
    case 'move_fragment': return 'Fragment ' + a.fragment + ' verplaatsen naar positie ' + a.position + (a.block ? ' in ' + blkName(a.block) : '');
    case 'duplicate_fragment': return 'Fragment ' + a.fragment + ' dupliceren';
    case 'delete_fragment': return 'Fragment ' + a.fragment + ' verwijderen';
    case 'add_voice': return 'Stemfragment toevoegen aan ' + blkName(a.block) + ': ' + a.source + ' ' + range() + ', anker ' + a.anchor + (a.offset != null ? ', offset ' + a.offset + ' s' : '') + (a.targetDuration != null ? ', gerekt naar ' + a.targetDuration + ' s' : '');
    case 'update_voice': return 'Stemfragment ' + a.voice + ' wijzigen: ' + Object.keys(a).filter(function (k) { return k !== 'voice'; }).map(function (k) { return k + ' = ' + a[k]; }).join(', ');

      var el2 = Math.max(0, ctx.currentTime - s.t0);
      stat.className = 'rstat live';
      stat.textContent = '● ' + fmt(el2).slice(0, -2) + ' · blok ' + fmt(s.startPt + el2).slice(0, -2);
    },
    progress: function () {
      var s = recSession, job = s && s.key ? jobs[s.key] : null;
      if (!job) { prog.style.display = 'none'; return; }
      prog.style.display = 'flex';
      prog.querySelector('.bar i').style.width = (job.fraction * 100) + '%';
      prog.querySelector('.pct').textContent = Math.round(job.fraction * 100) + '%';
      prog.querySelector('.lab').textContent = 'blok renderen · ' + job.label;
    },
    refresh: function () {
      var open = micIsOpen(), s = recSession, busy = !!s, li = latInfo();
      fillBlocks(); fillMics();
      micBtn.textContent = open ? 'Microfoon uit' : 'Microfoon aan'; micBtn.classList.toggle('on', open); micBtn.disabled = busy;
      micSel.disabled = busy;
      latTxt.textContent = 'latency ' + li.ms + ' ms · ' + (li.measured ? 'gemeten ' + li.base + ' ms' : 'geschat ' + li.base + ' ms') + (li.corr ? ', correctie ' + (li.corr > 0 ? '+' : '') + li.corr + ' ms' : '');
      latM.disabled = busy || li.corr <= -LAT_CORR_MAX; latP.disabled = busy || li.corr >= LAT_CORR_MAX;
      calBtn.disabled = busy;
      [blkSel, startIn, cntSel, noDuck, noVoice].forEach(function (x) { x.disabled = busy; });
      var rec = s && s.kind === 'rec';
      recBtn.innerHTML = rec ? '&#9632; Stop' : '&#9679; Opnemen'; recBtn.classList.toggle('on', !!rec);
      recBtn.disabled = (busy && !rec) || (rec && s.phase === 'stopping') || !R.blocks.length;
      helpBtn.disabled = busy;
      ui.status(); ui.meter(); ui.progress(); renderTakes();
    }
  };
  function renderTakes() {
    list.innerHTML = '';
    var ts = recTakes.filter(function (t) { return src(t.name); });
    allBtn.disabled = !ts.length;
    if (!ts.length) { list.appendChild(el('div', { class: 'dim', text: 'Nog geen opnames.' })); return; }
    var tb = el('table', { class: 'fr takes' }, [el('tr', null, ['Opname', 'Blok', 'Stem', 'Duur', 'In blok', '', ''].map(function (h) { return el('th', { text: h }); }))]);
    ts.forEach(function (t) {
      var b = blockById(t.block), v = b && t.voice ? findBy(b.voice, 'id', t.voice) : null;
      var dl = el('button', { class: 'tdl', text: 'Download', title: 'Deze opname als WAV downloaden', onclick: function () { downloadTake(t); } });
      var rp = el('button', { class: 'trp', text: 'Vervang vorige take', title: 'Het stemfragment waarmee deze take overlapt (of de vorige take in dit blok) verwijderen', onclick: function () { replacePrevTake(t); } });
      rp.disabled = !v || !!recSession;
      tb.appendChild(el('tr', { 'data-take': t.name }, [
        el('td', { text: t.name }), el('td', { text: b ? b.name : t.blockName }),
        el('td', { text: v ? v.id + ' · ' + v.anchor + ' +' + (v.offset || 0).toFixed(3) + ' s' : 'verwijderd', class: v ? '' : 'dim' }),
        el('td', { text: t.dur.toFixed(2) + ' s' }), el('td', { text: t.start.toFixed(3) + ' s' }),
        el('td', { html: t.saved ? '<span class="dim">opgeslagen</span>' : '<span class="badge orange">niet opgeslagen</span>' }),
        el('td', null, [dl, ' ', rp])
      ]));
    });
    list.appendChild(tb);
  }
  openPanel('● Voice-over opnemen', [
    el('div', { class: 'rrow' }, [el('span', { class: 'lbl', text: 'Microfoon' }), micSel, micBtn, meter, mdb, clipEl, el('span', { style: 'flex:1' }), helpBtn]),
    el('div', { class: 'rrow' }, [latTxt, latM, latP, calBtn, calOut]),
    el('div', { class: 'rrow' }, [el('span', { class: 'lbl', text: 'Blok' }), blkSel, el('span', { class: 'lbl', text: 'vanaf' }), startIn, cntSel,
      el('label', { class: 'chk' }, [noDuck, ' ducking uit']), el('label', { class: 'chk' }, [noVoice, ' oude stem stil']), recBtn, stat]),
    prog,
    el('h4', { text: 'Opnames' }), list, el('div', { class: 'rrow' }, [allBtn])
  ], function () {
    // paneel dicht: lopende opname stoppen en bewaren, dan de microfoon sluiten
    var s = recSession;
    recUI = null;
    if (s && s.kind === 'rec' && (s.phase === 'rec' || s.phase === 'stopping')) {
      if (s.phase === 'rec') recStop();
      s.cap.done.then(function () { setTimeout(function () { if (!recUI) micClose(); }, 0); });
      return;
    }
    if (s) recAbort(s.kind === 'cal' ? 'paneel gesloten tijdens het kalibreren' : 'paneel gesloten');
    micClose();
  });
  if (!blkSel.value && activeBlock) blkSel.value = activeBlock;
  ui.refresh();
}
$('btnRec').onclick = function () { openRecPanel(); };
// Spatie in het opnamepaneel = opnemen / stoppen (niet in tekstvelden)
['keydown', 'keyup'].forEach(function (evn) {
  document.addEventListener(evn, function (e) {
    if (!recUI || !panelOpen() || e.key !== ' ' || $('modal').style.display === 'flex') return;
    var t = e.target, tag = t && t.tagName;
    if ((tag === 'INPUT' && t.type === 'text') || tag === 'TEXTAREA') return;
    e.preventDefault(); e.stopPropagation();
    if (evn === 'keydown' && !e.repeat) recUI.toggle();
  }, true);
});
updateRecBtn();

/* ---------- start ---------- */
refreshState();
resize();
updatePlayBtn();
updateHistory();
window.__editor = { get state() { return R; }, say: say, get workerActive() { return !!wk; }, get useWorker() { return useWorker; }, get fit() { return fitInfo; }, get dirty() { return isDirty(); }, extractCommands: extractCommands,
  rec: { detect: detectClickLatency, CAL: CAL, calibrate: calibrate, get takes() { return recTakes; }, get last() { return recLast; }, get session() { return recSession; },
    get mic() { return { open: micIsOpen(), kind: mic.kind, moduleFrom: mic.moduleFrom, deviceId: mic.deviceId, label: mic.label, level: { peak: mic.lvl.peak, rms: mic.lvl.rms, n: mic.lvl.n } }; }, latency: function () { return latInfo(); }, unsaved: function () { return unsavedTakes().length; } } };
})();
</script>
