<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Audio Fit Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3743; --text:#dde3ea; --dim:#8b97a6;
  --accent:#4ea1ff; --accent2:#2f6fb5; --marker:#ffb74d; --cursor:#ff5a5a; --wave:#6fcf97;
  --green:#3fb950; --orange:#e3a008; --red:#e5534b; --blocked:#8e44ad;
  --lw:210px; --rw:300px; --drawerH:300px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;min-width:1000px}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent2);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.ghost:hover{border-color:var(--line);color:var(--text)}
button.danger{color:#ff8a80}
button.danger:hover{border-color:var(--red)}
input[type=text],input[type=number],select{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input[type=text]:focus,select:focus{outline:1px solid var(--accent)}
h2{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:0;text-transform:uppercase;font-weight:600}
.dim{color:var(--dim)}
.sp{flex:1}

/* ---------- kop ---------- */
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 4px 0 0;font-weight:600;white-space:nowrap}
header h1 small{color:var(--dim);font-weight:400;margin-left:4px}
#projName{width:180px;background:transparent;border-color:transparent;color:var(--dim)}
#projName:hover,#projName:focus{border-color:var(--line);color:var(--text)}
header .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.menu{position:relative}
.mpop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;display:none;z-index:60;min-width:230px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.mpop.open{display:grid;gap:4px}
.mpop button{text-align:left}
.mpop .chk{padding:4px 6px}
button.dirty{border-color:var(--orange);color:var(--orange)}
button.rec{color:#ff6b6b}
button.rec.on{background:#8a2020;border-color:var(--red);color:#fff}

/* ---------- hoofdindeling ---------- */
main{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw)}
main.noL{--lw:34px} main.noR{--rw:34px}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;flex:none}
.ph h2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody2{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
button.coll{padding:1px 7px;color:var(--dim);background:transparent;border-color:transparent}
button.coll:hover{border-color:var(--line);color:var(--text)}
main.noL .pane.left .ph{flex-direction:column;padding:8px 2px}
main.noL .pane.left .ph > :not(.coll),main.noL .pane.left .pbody2{display:none}
main.noR .pane.right .ph{flex-direction:column;padding:8px 2px}
main.noR .pane.right .ph > :not(.coll),main.noR .pane.right .pbody2{display:none}

/* blokkenlijst */
.bitem{display:block;width:100%;text-align:left;padding:7px 8px;margin:0 0 4px;border-radius:5px;background:transparent;border:1px solid transparent;white-space:normal}
.bitem:hover{background:var(--panel2);border-color:var(--line)}
.bitem.active{background:rgba(47,111,181,.28);border-color:var(--accent2)}
.bitem .bn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .bm{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;margin-top:3px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.bitem .lprog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;display:none}
.bitem .lprog i{display:block;height:100%;width:0;background:var(--accent)}
.st{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.st.ok{color:var(--green);border-color:rgba(63,185,80,.5)}
.st.short{color:var(--orange);border-color:rgba(227,160,8,.5)}
.st.long,.st.bad{color:var(--red);border-color:rgba(229,83,75,.55)}
.st.empty{color:var(--dim)}

/* ---------- actief blok ---------- */
#stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.shead .title{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.shead .title b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.shead .title .td{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent2);color:#fff}
.duckf{display:flex;align-items:center;gap:4px;color:var(--dim);white-space:nowrap}
.duckf input{width:46px;text-align:right}
.smsgs{padding:0 14px}
.smsgs:empty{display:none}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 12px;gap:6px}
.tlwrap{flex:1 1 auto;min-height:150px;max-height:440px}
.tlbar{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.tlbar .zl{font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.tlwrap{display:flex;min-height:0;border:1px solid var(--line);border-radius:6px;background:#10141a;overflow:hidden}
.tllab{flex:none;width:62px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tllab div{display:flex;align-items:center;padding-left:8px;font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;font-weight:600}
#tlScroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;outline:none}
#tlScroll:focus-visible{box-shadow:inset 0 0 0 1px var(--accent)}
.tl{position:relative;user-select:none;min-width:100%;height:100%;display:flex;flex-direction:column}
.tl .ruler{position:relative;flex:none;height:22px;color:var(--dim);font-size:10px;border-bottom:1px solid var(--line);cursor:pointer;background:#141920}
.tl .ruler span{position:absolute;top:0;border-left:1px solid #3a4452;padding:3px 0 0 3px;height:22px;white-space:nowrap;pointer-events:none}
.tl .row{position:relative;border-bottom:1px solid #222a35;overflow:hidden}
.tl .row.music{flex:5 1 0;min-height:60px}
.tl .row.voice{flex:3 1 0;min-height:40px;border-bottom:none}
.h-ruler{height:23px;flex:none}.h-music{flex:5 1 0;min-height:60px}.h-voice{flex:3 1 0;min-height:40px}
.tl .hint{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;color:var(--dim);font-size:12px;pointer-events:none}
.silz{position:absolute;top:0;bottom:0;z-index:0;background:repeating-linear-gradient(45deg,rgba(139,151,166,.18) 0 5px,transparent 5px 10px);border-left:1px dashed var(--dim);pointer-events:none}
.silz span,.overz span{position:absolute;bottom:3px;left:5px;font-size:10px;color:var(--dim);white-space:nowrap}
.overz{position:absolute;top:0;bottom:0;z-index:5;background:rgba(229,83,75,.22);border-left:2px solid var(--red);pointer-events:none}
.overz span{color:#ff9c95}
.endline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #c9d3df;z-index:6;pointer-events:none;opacity:.55}
.tl .tfr{position:absolute;top:6px;bottom:6px;background:#284f7c;border:1px solid #3d6d9f;border-radius:4px;overflow:hidden;white-space:nowrap;font-size:11px;padding:4px 6px;border-bottom:4px solid transparent;color:#fff;cursor:grab;z-index:1}
.tfr canvas{position:absolute;left:0;right:0;bottom:0;top:20px;width:100%;height:calc(100% - 20px);pointer-events:none;opacity:.55}
.tfr .lb{position:relative;z-index:1;text-shadow:0 0 3px #000}
.tfr.green{border-bottom-color:var(--green)}.tfr.orange{border-bottom-color:var(--orange)}.tfr.red{border-bottom-color:var(--red)}.tfr.blocked{border-bottom-color:var(--blocked)}
.tfr.sel,.tvo.sel{outline:2px solid #fff;outline-offset:-1px;z-index:3}
.tfr.miss{background:#6b5a1f}
.tfr.anc{outline:2px dashed var(--marker);outline-offset:-2px}
.tfr.dragging,.tvo.dragging{opacity:.8;z-index:8;cursor:grabbing}
.tfr .rt,.tvo .rt{opacity:.8;margin-left:6px;font-size:10px}
.tfr .eg{position:absolute;top:0;bottom:0;right:0;width:9px;cursor:ew-resize;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25));border-right:3px solid rgba(255,255,255,.55)}
.tfr .eg:hover,.tfr .eg.act{background:linear-gradient(90deg,transparent,rgba(78,161,255,.6));border-right-color:#fff}
.tfr .dl{position:absolute;right:12px;top:4px;font-size:10px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.55);display:none;z-index:3}
.tfr.resizing .dl{display:block}
.tz{position:absolute;top:0;bottom:0;z-index:4;cursor:pointer;font-size:9px;color:#fff;overflow:visible;white-space:nowrap}
.tz span{position:absolute;left:2px;top:1px;pointer-events:none;text-shadow:0 0 2px #000}
.tz.ov{background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,rgba(255,255,255,.12) 3px 6px);border-left:1px solid #fff;border-right:1px solid #fff}
.tz.ov.duck{background:repeating-linear-gradient(45deg,rgba(255,183,77,.8) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.ov.mix{background:repeating-linear-gradient(45deg,rgba(229,83,75,.7) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.gap{background:rgba(0,0,0,.65);border:1px dashed var(--dim)}
.tz.cut::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.tz .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tz .h.l{left:-4px}.tz .h.r{right:-4px}
.tz .h:hover{background:rgba(78,161,255,.7)}
.tz.sel{box-shadow:0 0 0 2px #ffd54f}
.duckz{position:absolute;bottom:0;height:5px;z-index:3;pointer-events:none;background:repeating-linear-gradient(-45deg,rgba(255,183,77,.9) 0 3px,rgba(255,183,77,.25) 3px 6px)}
.dropline{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #ffd54f;z-index:9;pointer-events:none}
.tlcur{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--cursor);z-index:10;display:none;pointer-events:none}
.tlpos{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--accent);z-index:9;pointer-events:none}
.tlpos.r::before{content:"";position:absolute;left:-6px;top:0;border:6px solid transparent;border-top-color:var(--accent)}
.tl .tvo{position:absolute;top:7px;bottom:7px;background:#6a4396;border:1px solid #8a63b8;border-radius:4px;overflow:hidden;white-space:nowrap;font-size:11px;padding:4px 6px;color:#fff;cursor:grab;z-index:2;border-bottom:3px solid transparent}
.tvo.green{border-bottom-color:var(--green)}.tvo.orange{border-bottom-color:var(--orange)}.tvo.red{border-bottom-color:var(--red)}.tvo.blocked{border-bottom-color:var(--blocked)}
.tvo.ovl{box-shadow:0 0 0 2px var(--red)}
.ancl{position:absolute;top:3px;height:0;border-top:1px dashed var(--marker);z-index:1;pointer-events:none}
.ancl b{position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--marker)}
.noblk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim)}
.noblk b{color:var(--text);font-size:15px}

/* meldingen */
.badge{padding:1px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.green{background:rgba(63,185,80,.18);color:var(--green);border-color:var(--green)}
.orange{background:rgba(227,160,8,.18);color:var(--orange);border-color:var(--orange)}
.red{background:rgba(229,83,75,.18);color:var(--red);border-color:var(--red)}
.blocked{background:rgba(142,68,173,.25);color:#c58be0;border-color:var(--blocked)}
.warnbox,.errbox{margin:6px 0 0;padding:4px 8px;border-radius:4px;font-size:12px;border:1px solid var(--orange);background:rgba(227,160,8,.14);color:var(--orange)}
.errbox{border-color:var(--red);background:rgba(229,83,75,.14);color:var(--red)}
.errbox .x{float:right;padding:0 6px}
.wlist{margin:4px 0 0;font-size:11px;color:var(--orange)}
.rprog{align-items:center;gap:8px;margin:6px 0 0;font-size:12px}
.rprog .bar,.sprog .bar{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.rprog .bar i,.sprog .bar i{display:block;height:100%;width:0;background:var(--accent)}
.rprog .pct,.sprog .pct{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.rprog .lab,.sprog .lab{color:var(--dim);white-space:nowrap}
.sprog{display:none;align-items:center;gap:8px;font-size:12px;flex:none}
button.busy{color:var(--accent)}

/* ---------- inspector ---------- */
.ins h3{font-size:14px;margin:2px 0 2px;font-weight:600;word-break:break-all}
.ins .sub{color:var(--dim);font-size:12px;margin-bottom:8px;word-break:break-all}
.ins .grp{border-top:1px solid var(--line);padding:8px 0 4px;margin-top:6px}
.ins .grp>h2{margin-bottom:6px}
.frow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:4px 8px;margin:4px 0}
.frow>label{color:var(--dim);font-size:12px}
.frow input[type=text],.frow select{width:100%;min-width:0}
.frow .pair{display:flex;gap:6px;align-items:center}
.frow .pair input{flex:1;min-width:0}
.ins .chk{display:flex;align-items:center;gap:5px;margin:4px 0}
.ins .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ins .acts.end{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ratio{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:3px;color:var(--text);white-space:nowrap}
.kbd{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}

/* ---------- bronnen-la ---------- */
#drawer{flex:none;height:var(--drawerH);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);position:relative;min-height:0}
#drawer.closed{height:auto}
#drawer.closed .dbody{display:none}
#drawerGrip{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:5}
#drawerGrip:hover{background:rgba(78,161,255,.35)}
#drawer.closed #drawerGrip{display:none}
.dhead{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);flex:none;min-width:0}
#btnDrawer{font-weight:600;letter-spacing:.04em}
#srcTabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
.stab{border-radius:4px 4px 0 0;border-color:transparent;background:transparent;color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.stab:hover{color:var(--text)}
.stab.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
.stab.missing{color:var(--orange)}
.stab small{color:var(--dim);margin-left:4px}
#missing{display:none;color:var(--orange);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 200px}
.dmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.wavewrap{position:relative;flex:1;min-height:70px;background:#0c0f13}
.wavewrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
.wavewrap.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
#scroll{width:100%;margin:0;height:12px;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:5px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctrl .grp{display:flex;align-items:center;gap:4px}
.ctrl label{color:var(--dim)}
.ctrl .vsep{width:1px;height:18px;background:var(--line)}
.tf{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.nud button{padding:1px 4px;font-size:11px}
button.add{background:#24456b;border-color:var(--accent2)}
button.addv{background:#4a3266;border-color:#7b4fa8}
.dside{border-left:1px solid var(--line);overflow:auto;padding:6px 8px;min-height:0}
.dside h2{margin:2px 0 4px}
.mrow{display:flex;gap:4px;align-items:center;padding:2px 4px;border-radius:4px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow .mn{flex:1;word-break:break-all}
.mrow .mt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}
.mrow button{padding:0 5px;font-size:11px}
.between{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.between h2{grid-column:1/-1}
.between select{width:100%;min-width:0}
.between button{grid-column:1/-1}
#mname{position:absolute;display:none;z-index:20;width:120px}

/* ---------- voet, menu's, dialogen ---------- */
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 10px;display:flex;gap:10px;align-items:center;position:relative}
#status{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#status.err{color:var(--red)}#status.warn{color:var(--orange)}#status.ok{color:var(--green)}
#log{position:absolute;left:0;right:0;bottom:100%;max-height:220px;overflow:auto;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;display:none;font-size:12px;z-index:40}
#log div.err{color:var(--red)}#log div.warn{color:var(--orange)}
#ctx{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:5px;z-index:250;min-width:170px;padding:3px 0;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#ctx div{padding:5px 14px;cursor:pointer;white-space:nowrap}#ctx div:hover{background:var(--accent2)}
#ctx div.sep{height:1px;padding:0;margin:3px 0;background:var(--line);cursor:default}
#ctx div.dis{opacity:.4;pointer-events:none}
#ctx div .k{float:right;color:var(--dim);margin-left:16px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:540px}
.modal h3{margin:0 0 8px;font-size:15px}.modal p{margin:0 0 14px;color:var(--dim)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal .fields{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:0 0 14px}
.modal .fields label{color:var(--dim)}
.modal .box.wide{width:min(820px,94vw);max-width:none;max-height:88vh;overflow:auto}
.modal .phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.modal .phead h3{margin:0;flex:1}
.modal h4{margin:12px 0 4px;font-size:13px}
.modal textarea{background:#0f1216;border:1px solid var(--line);border-radius:4px;color:var(--text);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:6px}
.cmsg{margin:4px 0;font-size:12px}.cmsg.ok{color:var(--green)}.cmsg.warn{color:var(--orange)}
.aiprev ol,.aires ol{margin:4px 0;padding-left:24px}.aiprev li,.aires li{margin:2px 0}
.aires li.ok{color:var(--green)}.aires li.bad{color:var(--red)}.aires li.dim{color:var(--dim)}
.okbox{margin:4px 0;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid var(--green);background:rgba(63,185,80,.14);color:var(--green)}

<script id="audiofit-core">/*@@CORE@@*/</script>
<script>
(function () {
'use strict';
var AF = window.AudioFit;
var $ = function (id) { return document.getElementById(id); };

/* ---------- statusbalk ---------- */
var logEl = $('log'), statusEl = $('status'), logItems = [];
function say(msg, level) {
  level = level || '';
  statusEl.textContent = msg; statusEl.className = level;
  logItems.push({ msg: msg, level: level });
  if (logItems.length > 60) logItems.shift();
  var d = document.createElement('div'); d.className = level; d.textContent = msg; logEl.appendChild(d);
  while (logEl.childNodes.length > 60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
statusEl.addEventListener('click', function () { logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block'; });

if (!AF) { say('Kern (AudioFit) ontbreekt: bouw audiofit.html met build.mjs.', 'err'); return; }
$('ver').textContent = 'v' + AF.version;

/* ---------- hulpfuncties ---------- */
function run(cmd, args) {
  var r = AF.exec({ cmd: cmd, args: args || {} });
  if (!r.ok) say(r.error, 'err');
  return r;
}
function fmt(t) {
  if (t == null || !isFinite(t)) return '';
  var neg = t < 0; t = Math.abs(t);
  var ms = Math.round(t * 1000), m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return (neg ? '-' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + ('00' + r).slice(-3);
}
function parseT(str) {
  str = String(str).trim().replace(',', '.');
  if (!str) return NaN;
  var p = str.split(':'), v = 0;
  if (p.length > 3) return NaN;
  for (var i = 0; i < p.length; i++) { if (!/^\d*\.?\d*$/.test(p[i]) || p[i] === '') return NaN; v = v * 60 + parseFloat(p[i]); }
  return v;
}
function r3(x) { return Math.round(x * 1000) / 1000; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- state ---------- */
var R = { sources: [], blocks: [] };      // recept (uit kern)
var views = {};                            // per bron: {viewStart, pps, sel, cursor}
var activeSrc = null, activeBlock = null;
var fitInfo = { frags: {}, blocks: {} }, fitKey = '';
var ctx = null, srOK = false;
var bufCache = {};                         // bron -> {key, buf}
var peakCache = {};                        // bron -> {B, mins, maxs, sr, n}

function src(name) { for (var i = 0; i < R.sources.length; i++) if (R.sources[i].name === name) return R.sources[i]; return null; }
function curSrc() { return activeSrc ? src(activeSrc) : null; }
function hasAudio(name) { try { return !!AF.getAudio(name); } catch (e) { return false; } }
function view(name) {
  if (!views[name]) views[name] = { viewStart: 0, pps: 0, sel: null, cursor: 0, fitted: false };
  return views[name];
}
function V() { return activeSrc ? view(activeSrc) : null; }

/* ---------- AudioContext ---------- */
async function ensureCtx() {
  if (!ctx) {
    var C = window.AudioContext || window.webkitAudioContext;
    ctx = new C();
  }
  if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
  return ctx;
}

/* ---------- laden ---------- */
async function loadFiles(files) {
  files = Array.prototype.slice.call(files);
  if (!files.length) return;
  await ensureCtx();
  var first = null, ok = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var ab = await f.arrayBuffer();
      var buf = await ctx.decodeAudioData(ab);
      if (buf.duration > 1200) say(f.name + ': ' + fmt(buf.duration) + ' lang (> 20 min); dit gebruikt veel geheugen. Toch geladen.', 'warn');
      var chans = [];
      for (var c = 0; c < buf.numberOfChannels; c++) chans.push(new Float32Array(buf.getChannelData(c)));
      if (!srOK) {
        try { AF.setSampleRate(ctx.sampleRate); } catch (e) { say('setSampleRate: ' + e.message, 'warn'); }
        srOK = true;
      }
      var rs = src(f.name), wasMissing = !!rs && !hasAudio(f.name), exists = hasAudio(f.name);
      var used = AF.attachAudio(f.name, { sampleRate: buf.sampleRate, channels: chans, rename: exists }, exists ? { rename: true } : undefined);
      if (used && typeof used === 'object') used = used.name || used.used || f.name;
      used = used || f.name;
      delete peakCache[used]; delete bufCache[used]; delete views[used];
      refreshState();
      if (!first) first = used;
      ok++;
      say('Geladen: ' + used + ' (' + fmt(buf.duration) + ', ' + buf.numberOfChannels + ' kanaal/kanalen).' + (wasMissing ? ' Gekoppeld aan het recept.' : ''), 'ok');
      if (wasMissing && rs && Math.abs(rs.duration - buf.duration) > 0.01) say(used + ': duur in het recept ' + fmt(rs.duration) + ', geladen bestand ' + fmt(buf.duration) + '. Is dit hetzelfde bestand?', 'warn');
    } catch (e) {
      say('Kan ' + f.name + ' niet decoderen: ' + (e && e.message ? e.message : e), 'err');
    }
  }
  if (first) { setDrawer(true); setActive(first); focusZone = 'src'; }
  if (files.length > 1) say(ok + ' van ' + files.length + ' bestanden geladen.', ok === files.length ? 'ok' : 'warn');
}
$('btnLoad').onclick = function () { $('file').click(); };
$('file').onchange = function (e) { var fl = e.target.files; loadFiles(fl).then(function () { $('file').value = ''; }); };
var ww = $('wavewrap');
['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); ww.classList.add('dragover'); }); });
['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement || !e.relatedTarget) ww.classList.remove('dragover'); }); });
document.addEventListener('drop', function (e) {
  if (!(e.dataTransfer && e.dataTransfer.files.length)) return;
  var all = Array.prototype.slice.call(e.dataTransfer.files);
  var js = all.filter(function (f) { return /\.json$/i.test(f.name) || f.type === 'application/json'; });
  var au = all.filter(function (f) { return js.indexOf(f) < 0; });
  if (js.length > 1) say('Meerdere .json-bestanden gesleept; alleen ' + js[0].name + ' wordt als recept geladen.', 'warn');
  // eerst het recept, dan de audio: de bronnen koppelen dan meteen aan het recept
  (js.length ? loadRecipeFile(js[0]) : Promise.resolve()).then(function () { if (au.length) return loadFiles(au); });
});

/* ---------- piekdata ---------- */
function getBase(name) {
  var pc = peakCache[name];
  if (pc) return pc;
  var a = AF.getAudio(name);
  if (!a) return null;
  var B = 64, n = a.channels[0].length, nb = Math.ceil(n / B);
  var mins = new Float32Array(nb), maxs = new Float32Array(nb);
  for (var b = 0; b < nb; b++) { mins[b] = 1; maxs[b] = -1; }
  for (var c = 0; c < a.channels.length; c++) {
    var d = a.channels[c];
    for (var b2 = 0; b2 < nb; b2++) {
      var s0 = b2 * B, s1 = Math.min(n, s0 + B), mn = mins[b2], mx = maxs[b2];
      for (var s = s0; s < s1; s++) { var v = d[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
      mins[b2] = mn; maxs[b2] = mx;
    }
  }
  pc = peakCache[name] = { B: B, mins: mins, maxs: maxs, sr: a.sampleRate, n: n, audio: a };
  return pc;
}

/* ---------- golfvorm ---------- */
var cv = $('cv'), g = cv.getContext('2d'), AXIS = 24, CW = 300, CH = 200, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  var r = ww.getBoundingClientRect();
  CW = Math.max(50, Math.floor(r.width)); CH = Math.max(50, Math.floor(r.height));
  cv.width = Math.floor(CW * DPR); cv.height = Math.floor(CH * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitIfNeeded(); draw();
}
new ResizeObserver(resize).observe(ww);

function dur() { var s = curSrc(); return s ? s.duration : 0; }
function minPps() { var d = dur(); return d > 0 ? CW / d : 1; }
function fitIfNeeded() {
  var v = V(); if (!v) return;
  if (!v.fitted) { v.pps = minPps(); v.viewStart = 0; v.fitted = true; }
  else { v.pps = Math.max(v.pps, minPps()); clampView(v); }
}
function clampView(v) {
  var vd = CW / v.pps, d = dur();
  v.viewStart = clamp(v.viewStart, 0, Math.max(0, d - vd));
}
function t2x(t) { var v = V(); return (t - v.viewStart) * v.pps; }
function x2t(x) { var v = V(); return clamp(v.viewStart + x / v.pps, 0, dur()); }
function tickStep(pps) {
  var steps = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800];
  for (var i = 0; i < steps.length; i++) if (steps[i] * pps >= 80) return steps[i];
  return 3600;
}
function markersOf(name) { var s = src(name); return s && s.markers ? s.markers : []; }

function draw() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#0c0f13'; g.fillRect(0, 0, CW, CH);
  var s = curSrc(), v = V();
  $('dropmsg').style.display = s ? 'none' : 'flex';
  if (!s || !v) return;
  var d = s.duration, wh = CH - AXIS, mid = AXIS + wh / 2;
  // as
  g.fillStyle = '#161b22'; g.fillRect(0, 0, CW, AXIS);
  g.strokeStyle = '#2f3743'; g.beginPath(); g.moveTo(0, AXIS + .5); g.lineTo(CW, AXIS + .5); g.stroke();
  var step = tickStep(v.pps), t0 = Math.floor(v.viewStart / step) * step;
  g.font = '11px system-ui'; g.fillStyle = '#8b97a6'; g.textBaseline = 'middle';
  g.strokeStyle = '#1f2630';
  for (var t = t0; t <= v.viewStart + CW / v.pps; t += step) {
    var x = Math.round(t2x(t)) + .5;
    g.beginPath(); g.moveTo(x, AXIS - 6); g.lineTo(x, CH); g.stroke();
    g.fillText(step < 1 ? fmt(t) : fmt(t).slice(0, -4), x + 3, 8);
  }
  // middenlijn
  g.strokeStyle = '#2a323d'; g.beginPath(); g.moveTo(0, mid + .5); g.lineTo(CW, mid + .5); g.stroke();
  // golfvorm
  var pc = hasAudio(s.name) ? getBase(s.name) : null;
  if (pc) {
    var sr = pc.sr, B = pc.B, data = pc.audio.channels, amp = wh / 2 - 2;
    g.fillStyle = '#6fcf97';
    for (var i = 0; i < CW; i++) {
      var a0 = v.viewStart + i / v.pps, a1 = v.viewStart + (i + 1) / v.pps;
      if (a0 >= d) break;
      var s0 = Math.max(0, Math.floor(a0 * sr)), s1 = Math.min(pc.n, Math.max(s0 + 1, Math.ceil(a1 * sr)));
      var mn = 1, mx = -1;
      if (s1 - s0 > B * 2) {
        var b0 = Math.floor(s0 / B), b1 = Math.min(pc.mins.length, Math.ceil(s1 / B));
        for (var b = b0; b < b1; b++) { if (pc.mins[b] < mn) mn = pc.mins[b]; if (pc.maxs[b] > mx) mx = pc.maxs[b]; }
      } else {
        for (var c = 0; c < data.length; c++) { var dd = data[c]; for (var k = s0; k < s1; k++) { var y = dd[k]; if (y < mn) mn = y; if (y > mx) mx = y; } }
      }
      if (mn > mx) continue;
      var y0 = mid - mx * amp, y1 = mid - mn * amp;
      g.fillRect(i, y0, 1, Math.max(1, y1 - y0));
    }
  } else {
    g.fillStyle = '#e3a008'; g.font = '13px system-ui'; g.textBaseline = 'middle';
    g.fillText('Audio niet geladen: laad het bestand "' + s.name + '".', 12, mid);
  }
  // selectie
  if (v.sel && v.sel.out > v.sel.in) {
    var xa = t2x(v.sel.in), xb = t2x(v.sel.out);
    g.fillStyle = 'rgba(78,161,255,.22)'; g.fillRect(xa, AXIS, xb - xa, wh);
    g.fillStyle = '#4ea1ff'; g.fillRect(Math.round(xa) - 1, AXIS, 3, wh); g.fillRect(Math.round(xb) - 1, AXIS, 3, wh);
  } else if (v.sel) {
    g.fillStyle = '#4ea1ff'; g.fillRect(Math.round(t2x(v.sel.in)) - 1, AXIS, 3, wh);
  }
  // markers
  var ms = markersOf(s.name);
  g.font = '11px system-ui'; g.textBaseline = 'middle';
  for (var m = 0; m < ms.length; m++) {
    var mt = (dragM && dragM.name === ms[m].name) ? dragM.time : ms[m].time;
    var mx2 = Math.round(t2x(mt)) + .5;
    if (mx2 < -100 || mx2 > CW + 100) continue;
    g.strokeStyle = '#ffb74d'; g.beginPath(); g.moveTo(mx2, 0); g.lineTo(mx2, CH); g.stroke();
    var w = g.measureText(ms[m].name).width + 8;
    g.fillStyle = '#ffb74d'; g.fillRect(mx2, 2, w, 16);
    g.fillStyle = '#1b1f26'; g.fillText(ms[m].name, mx2 + 4, 10);
  }
  // cursor
  var ct = (play && play.kind === 'src') ? playPos() : null;
  var cx = ct != null ? ct : v.cursor;
  var cxp = Math.round(t2x(cx)) + .5;
  if (cxp >= 0 && cxp <= CW) {
    g.strokeStyle = '#ff5a5a'; g.beginPath(); g.moveTo(cxp, 0); g.lineTo(cxp, CH); g.stroke();
    g.fillStyle = '#ff5a5a'; g.beginPath(); g.moveTo(cxp - 5, 0); g.lineTo(cxp + 5, 0); g.lineTo(cxp, 7); g.fill();
  }

async function downloadAllTakes() {

function replacePrevTake(t) {

/* --- paneel --- */
function dbTxt(v) { return v > 0 ? (20 * Math.log(v) / Math.LN10).toFixed(1) : '-inf'; }
function dbPct(v) { var d = v > 0 ? 20 * Math.log(v) / Math.LN10 : -100; return clamp((d + 60) / 60, 0, 1) * 100; }

  var list = el('div', { id: 'recTakes' });

  var helpBtn = el('button', { id: 'recHelp', text: '?', title: 'Uitleg over opnemen en kalibreren', onclick: function () { if (recSession) return; closePanel(); openHelpPanel(); var h = document.getElementById('hRec'); if (h) h.scrollIntoView(); } });
  var cnt0 = lsGet('audiofit.recCount'); cntSel.value = cnt0 != null && /^[0-4]$/.test(cnt0) ? cnt0 : '2';

})();
