<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Audio Fit Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3743; --text:#dde3ea; --dim:#8b97a6;
  --accent:#4ea1ff; --accent2:#2f6fb5; --marker:#ffb74d; --cursor:#ff5a5a; --wave:#6fcf97;
  --green:#3fb950; --orange:#e3a008; --red:#e5534b; --blocked:#8e44ad;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent2);border-color:var(--accent)}
input[type=text],input[type=number],select{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input[type=text]:focus,select:focus{outline:1px solid var(--accent)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
header h1 small{color:var(--dim);font-weight:400;margin-left:6px}
header .sp{flex:1}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{flex:1 1 55%;min-height:260px;display:grid;grid-template-columns:190px 1fr 220px;border-bottom:1px solid var(--line)}
.side{background:var(--panel);overflow:auto;padding:6px}
.side h2,.blocks h2{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:2px 2px 6px;text-transform:uppercase}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.src{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;gap:4px;align-items:center;word-break:break-all}
.src:hover{background:var(--panel2)}
.src.active{background:var(--accent2)}
.src .meta{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.src.missing{color:var(--orange)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.wavewrap{position:relative;flex:1;min-height:150px;background:#0c0f13}
.wavewrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
.wavewrap.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
#scroll{width:100%;margin:0;height:14px;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctrl .grp{display:flex;align-items:center;gap:4px}
.ctrl label{color:var(--dim)}
.tf{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.nud button{padding:2px 5px;font-size:11px}
.chk{display:flex;align-items:center;gap:3px;color:var(--text)}
.mrow{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow .mn{flex:1;word-break:break-all}
.mrow .mt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.mrow button{padding:0 5px;font-size:11px}
.between{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:grid;gap:4px}
.between select{width:100%}
.blocks{flex:1 1 45%;min-height:140px;overflow:auto;background:var(--bg);padding:6px 10px}
.blocks .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:6px 8px}
.blk.active{border-color:var(--accent)}
.blk .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .bh .nm{width:130px}
.blk .bh .td{width:84px;text-align:right}
.badge{padding:1px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.green{background:rgba(63,185,80,.18);color:var(--green);border-color:var(--green)}
.orange{background:rgba(227,160,8,.18);color:var(--orange);border-color:var(--orange)}
.red{background:rgba(229,83,75,.18);color:var(--red);border-color:var(--red)}
.blocked{background:rgba(142,68,173,.25);color:#c58be0;border-color:var(--blocked)}
.seg{display:flex;height:22px;margin:6px 0;gap:2px}
.seg div{background:var(--accent2);border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;min-width:6px;border-bottom:3px solid transparent}
.seg div{color:#fff!important}
.seg div.green{border-bottom-color:var(--green)}.seg div.orange{border-bottom-color:var(--orange)}
.seg div.red{border-bottom-color:var(--red)}.seg div.blocked{border-bottom-color:var(--blocked)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
table.fr{border-collapse:collapse;width:100%;font-size:12px}
table.fr th{color:var(--dim);text-align:left;font-weight:500;padding:2px 6px;border-bottom:1px solid var(--line)}
table.fr td{padding:2px 6px;border-bottom:1px solid #242a33;font-variant-numeric:tabular-nums}
table.fr select{padding:1px 3px}
tr.miss td{color:var(--orange)}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 10px;display:flex;gap:10px;align-items:center;position:relative}
#status{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#status.err{color:var(--red)}#status.warn{color:var(--orange)}#status.ok{color:var(--green)}
#log{position:absolute;left:0;right:0;bottom:100%;max-height:220px;overflow:auto;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;display:none;font-size:12px}
#log div.err{color:var(--red)}#log div.warn{color:var(--orange)}
#ctx{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px;z-index:50;min-width:130px}
#ctx div{padding:5px 12px;cursor:pointer}#ctx div:hover{background:var(--accent2)}
#mname{position:absolute;display:none;z-index:20;width:120px}
.dim{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Audio Fit Tool <small id="ver"></small></h1>
  <button id="btnLoad" title="Audiobestanden laden">Laden</button>
  <input id="file" type="file" accept="audio/*,.wav,.mp3" multiple hidden>
  <button id="btnUndo" title="Ongedaan maken (Ctrl+Z)">&#8630;</button>
  <button id="btnRedo" title="Opnieuw (Ctrl+Y)">&#8631;</button>
  <span class="sp"></span>
  <span class="dim" id="hint">Spatie afspelen &middot; I/O in/uit &middot; M marker &middot; L loop &middot; Enter selectie &rarr; blok</span>
</header>
<main>
  <div class="top">
    <div class="side left"><h2>Bronnen</h2><div id="sources"></div></div>
    <div class="center">
      <div class="wavewrap" id="wavewrap">
        <canvas id="cv"></canvas>
        <div class="drop" id="dropmsg">Sleep WAV- of MP3-bestanden hierheen, of kies Laden.</div>
        <input type="text" id="mname" placeholder="naam (leeg = auto)">
      </div>
      <input type="range" id="scroll" min="0" max="1000" value="0" step="1">
      <div class="ctrl">
        <div class="grp"><label>in</label><input class="tf" type="text" id="fIn">
          <span class="nud"><button data-f="in" data-d="-10">-10</button><button data-f="in" data-d="-1">-1</button><button data-f="in" data-d="1">+1</button><button data-f="in" data-d="10">+10</button></span></div>
        <div class="grp"><label>uit</label><input class="tf" type="text" id="fOut">
          <span class="nud"><button data-f="out" data-d="-10">-10</button><button data-f="out" data-d="-1">-1</button><button data-f="out" data-d="1">+1</button><button data-f="out" data-d="10">+10</button></span></div>
        <div class="grp"><label>duur</label><input class="tf" type="text" id="fDur"></div>
        <div class="grp"><label>cursor</label><span id="curtxt" class="tf" style="display:inline-block">0:00.000</span></div>
      </div>
      <div class="ctrl" style="border-top:none">
        <button id="btnPlay">&#9654; Afspelen</button>
        <label class="chk"><input type="checkbox" id="chkLoop"> loop (L)</label>
        <label class="chk"><input type="checkbox" id="chkLast2"> alleen laatste 2 s</label>
        <label class="chk"><input type="checkbox" id="chkSnap" checked> snap nuldoorgang</label>
        <button id="btnMarker">M marker</button>
        <button id="btnToBlock">&rarr; blok (Enter)</button>
        <button id="btnFit">Hele bron</button>
      </div>
    </div>
    <div class="side right">
      <h2>Markers</h2><div id="markers"></div>
      <div class="between">
        <h2>Selecteer tussen markers</h2>
        <select id="selA"></select><select id="selB"></select>
        <button id="btnBetween">Selecteer</button>
      </div>
    </div>
  </div>
  <div class="blocks">
    <div class="bar"><h2 style="margin:0">Blokken</h2>
      <input type="text" id="nbName" placeholder="Bloknaam" style="width:140px">
      <input type="text" id="nbDur" value="15.000" style="width:70px;text-align:right" title="Doelduur in seconden">
      <span class="dim">s</span>
      <button id="btnNewBlock">+ nieuw blok</button>
    </div>
    <div id="blocklist"></div>
  </div>
</main>
<footer>
  <div id="log"></div>
  <div id="status" title="Klik voor het logboek">Klaar.</div>
</footer>
<div id="ctx"></div>

<script id="audiofit-core">/*@@CORE@@*/</script>
<script>
(function () {
'use strict';
var AF = window.AudioFit;
var $ = function (id) { return document.getElementById(id); };

/* ---------- statusbalk ---------- */
var logEl = $('log'), statusEl = $('status'), logItems = [];
function say(msg, level) {
  level = level || '';
  statusEl.textContent = msg; statusEl.className = level;
  logItems.push({ msg: msg, level: level });
  if (logItems.length > 60) logItems.shift();
  var d = document.createElement('div'); d.className = level; d.textContent = msg; logEl.appendChild(d);
  while (logEl.childNodes.length > 60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
statusEl.addEventListener('click', function () { logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block'; });

if (!AF) { say('Kern (AudioFit) ontbreekt: bouw audiofit.html met build.mjs.', 'err'); return; }
$('ver').textContent = 'v' + AF.version;

/* ---------- hulpfuncties ---------- */
function run(cmd, args) {
  var r = AF.exec({ cmd: cmd, args: args || {} });
  if (!r.ok) say(r.error, 'err');
  return r;
}
function fmt(t) {
  if (t == null || !isFinite(t)) return '';
  var neg = t < 0; t = Math.abs(t);
  var ms = Math.round(t * 1000), m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return (neg ? '-' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + ('00' + r).slice(-3);
}
function parseT(str) {
  str = String(str).trim().replace(',', '.');
  if (!str) return NaN;
  var p = str.split(':'), v = 0;
  if (p.length > 3) return NaN;
  for (var i = 0; i < p.length; i++) { if (!/^\d*\.?\d*$/.test(p[i]) || p[i] === '') return NaN; v = v * 60 + parseFloat(p[i]); }
  return v;
}
function r3(x) { return Math.round(x * 1000) / 1000; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- state ---------- */
var R = { sources: [], blocks: [] };      // recept (uit kern)
var views = {};                            // per bron: {viewStart, pps, sel, cursor}
var activeSrc = null, activeBlock = null;
var fitInfo = { frags: {}, blocks: {} }, fitKey = '';
var ctx = null, srOK = false;
var bufCache = {};                         // bron -> {key, buf}
var peakCache = {};                        // bron -> {B, mins, maxs, sr, n}

function src(name) { for (var i = 0; i < R.sources.length; i++) if (R.sources[i].name === name) return R.sources[i]; return null; }
function curSrc() { return activeSrc ? src(activeSrc) : null; }
function hasAudio(name) { try { return !!AF.getAudio(name); } catch (e) { return false; } }
function view(name) {
  if (!views[name]) views[name] = { viewStart: 0, pps: 0, sel: null, cursor: 0, fitted: false };
  return views[name];
}
function V() { return activeSrc ? view(activeSrc) : null; }

/* ---------- AudioContext ---------- */
async function ensureCtx() {
  if (!ctx) {
    var C = window.AudioContext || window.webkitAudioContext;
    ctx = new C();
  }
  if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
  return ctx;
}

/* ---------- laden ---------- */
async function loadFiles(files) {
  files = Array.prototype.slice.call(files);
  if (!files.length) return;
  await ensureCtx();
  var first = null, ok = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var ab = await f.arrayBuffer();
      var buf = await ctx.decodeAudioData(ab);
      if (buf.duration > 1200) say(f.name + ': ' + fmt(buf.duration) + ' lang (> 20 min); dit gebruikt veel geheugen. Toch geladen.', 'warn');
      var chans = [];
      for (var c = 0; c < buf.numberOfChannels; c++) chans.push(new Float32Array(buf.getChannelData(c)));
      if (!srOK) {
        try { AF.setSampleRate(ctx.sampleRate); } catch (e) { say('setSampleRate: ' + e.message, 'warn'); }
        srOK = true;
      }
      var exists = hasAudio(f.name);
      var used = AF.attachAudio(f.name, { sampleRate: buf.sampleRate, channels: chans, rename: exists }, exists ? { rename: true } : undefined);
      if (used && typeof used === 'object') used = used.name || used.used || f.name;
      used = used || f.name;
      delete peakCache[used]; delete bufCache[used]; delete views[used];
      refreshState();
      if (!first) first = used;
      ok++;
      say('Geladen: ' + used + ' (' + fmt(buf.duration) + ', ' + buf.numberOfChannels + ' kanaal/kanalen).', 'ok');
    } catch (e) {
      say('Kan ' + f.name + ' niet decoderen: ' + (e && e.message ? e.message : e), 'err');
    }
  }
  if (first) { setActive(first); }
  if (files.length > 1) say(ok + ' van ' + files.length + ' bestanden geladen.', ok === files.length ? 'ok' : 'warn');
}
$('btnLoad').onclick = function () { $('file').click(); };
$('file').onchange = function (e) { var fl = e.target.files; loadFiles(fl).then(function () { $('file').value = ''; }); };
var ww = $('wavewrap');
['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); ww.classList.add('dragover'); }); });
['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement || !e.relatedTarget) ww.classList.remove('dragover'); }); });
document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

/* ---------- piekdata ---------- */
function getBase(name) {
  var pc = peakCache[name];
  if (pc) return pc;
  var a = AF.getAudio(name);
  if (!a) return null;
  var B = 64, n = a.channels[0].length, nb = Math.ceil(n / B);
  var mins = new Float32Array(nb), maxs = new Float32Array(nb);
  for (var b = 0; b < nb; b++) { mins[b] = 1; maxs[b] = -1; }
  for (var c = 0; c < a.channels.length; c++) {
    var d = a.channels[c];
    for (var b2 = 0; b2 < nb; b2++) {
      var s0 = b2 * B, s1 = Math.min(n, s0 + B), mn = mins[b2], mx = maxs[b2];
      for (var s = s0; s < s1; s++) { var v = d[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
      mins[b2] = mn; maxs[b2] = mx;
    }
  }
  pc = peakCache[name] = { B: B, mins: mins, maxs: maxs, sr: a.sampleRate, n: n, audio: a };
  return pc;
}

/* ---------- golfvorm ---------- */
var cv = $('cv'), g = cv.getContext('2d'), AXIS = 24, CW = 300, CH = 200, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  var r = ww.getBoundingClientRect();
  CW = Math.max(50, Math.floor(r.width)); CH = Math.max(50, Math.floor(r.height));
  cv.width = Math.floor(CW * DPR); cv.height = Math.floor(CH * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitIfNeeded(); draw();
}
new ResizeObserver(resize).observe(ww);

function dur() { var s = curSrc(); return s ? s.duration : 0; }
function minPps() { var d = dur(); return d > 0 ? CW / d : 1; }
function fitIfNeeded() {
  var v = V(); if (!v) return;
  if (!v.fitted) { v.pps = minPps(); v.viewStart = 0; v.fitted = true; }
  else { v.pps = Math.max(v.pps, minPps()); clampView(v); }
}
function clampView(v) {
  var vd = CW / v.pps, d = dur();
  v.viewStart = clamp(v.viewStart, 0, Math.max(0, d - vd));
}
function t2x(t) { var v = V(); return (t - v.viewStart) * v.pps; }
function x2t(x) { var v = V(); return clamp(v.viewStart + x / v.pps, 0, dur()); }
function tickStep(pps) {
  var steps = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800];
  for (var i = 0; i < steps.length; i++) if (steps[i] * pps >= 80) return steps[i];
  return 3600;
}
function markersOf(name) { var s = src(name); return s && s.markers ? s.markers : []; }

function draw() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#0c0f13'; g.fillRect(0, 0, CW, CH);
  var s = curSrc(), v = V();
  $('dropmsg').style.display = s ? 'none' : 'flex';
  if (!s || !v) return;
  var d = s.duration, wh = CH - AXIS, mid = AXIS + wh / 2;
  // as
  g.fillStyle = '#161b22'; g.fillRect(0, 0, CW, AXIS);
  g.strokeStyle = '#2f3743'; g.beginPath(); g.moveTo(0, AXIS + .5); g.lineTo(CW, AXIS + .5); g.stroke();
  var step = tickStep(v.pps), t0 = Math.floor(v.viewStart / step) * step;
  g.font = '11px system-ui'; g.fillStyle = '#8b97a6'; g.textBaseline = 'middle';
  g.strokeStyle = '#1f2630';
  for (var t = t0; t <= v.viewStart + CW / v.pps; t += step) {
    var x = Math.round(t2x(t)) + .5;
    g.beginPath(); g.moveTo(x, AXIS - 6); g.lineTo(x, CH); g.stroke();
    g.fillText(step < 1 ? fmt(t) : fmt(t).slice(0, -4), x + 3, 8);
  }
  // middenlijn
  g.strokeStyle = '#2a323d'; g.beginPath(); g.moveTo(0, mid + .5); g.lineTo(CW, mid + .5); g.stroke();
  // golfvorm
  var pc = hasAudio(s.name) ? getBase(s.name) : null;
  if (pc) {
    var sr = pc.sr, B = pc.B, data = pc.audio.channels, amp = wh / 2 - 2;
    g.fillStyle = '#6fcf97';
    for (var i = 0; i < CW; i++) {
      var a0 = v.viewStart + i / v.pps, a1 = v.viewStart + (i + 1) / v.pps;
      if (a0 >= d) break;
      var s0 = Math.max(0, Math.floor(a0 * sr)), s1 = Math.min(pc.n, Math.max(s0 + 1, Math.ceil(a1 * sr)));
      var mn = 1, mx = -1;
      if (s1 - s0 > B * 2) {
        var b0 = Math.floor(s0 / B), b1 = Math.min(pc.mins.length, Math.ceil(s1 / B));
        for (var b = b0; b < b1; b++) { if (pc.mins[b] < mn) mn = pc.mins[b]; if (pc.maxs[b] > mx) mx = pc.maxs[b]; }
      } else {
        for (var c = 0; c < data.length; c++) { var dd = data[c]; for (var k = s0; k < s1; k++) { var y = dd[k]; if (y < mn) mn = y; if (y > mx) mx = y; } }
      }
      if (mn > mx) continue;
      var y0 = mid - mx * amp, y1 = mid - mn * amp;
      g.fillRect(i, y0, 1, Math.max(1, y1 - y0));
    }
  } else {
    g.fillStyle = '#e3a008'; g.font = '13px system-ui'; g.textBaseline = 'middle';
    g.fillText('Audio niet geladen: laad het bestand "' + s.name + '".', 12, mid);
  }
  // selectie
  if (v.sel && v.sel.out > v.sel.in) {
    var xa = t2x(v.sel.in), xb = t2x(v.sel.out);
    g.fillStyle = 'rgba(78,161,255,.22)'; g.fillRect(xa, AXIS, xb - xa, wh);
    g.fillStyle = '#4ea1ff'; g.fillRect(Math.round(xa) - 1, AXIS, 3, wh); g.fillRect(Math.round(xb) - 1, AXIS, 3, wh);
  } else if (v.sel) {
    g.fillStyle = '#4ea1ff'; g.fillRect(Math.round(t2x(v.sel.in)) - 1, AXIS, 3, wh);
  }
  // markers
  var ms = markersOf(s.name);
  g.font = '11px system-ui'; g.textBaseline = 'middle';
  for (var m = 0; m < ms.length; m++) {
    var mt = (dragM && dragM.name === ms[m].name) ? dragM.time : ms[m].time;
    var mx2 = Math.round(t2x(mt)) + .5;
    if (mx2 < -100 || mx2 > CW + 100) continue;
    g.strokeStyle = '#ffb74d'; g.beginPath(); g.moveTo(mx2, 0); g.lineTo(mx2, CH); g.stroke();
    var w = g.measureText(ms[m].name).width + 8;
    g.fillStyle = '#ffb74d'; g.fillRect(mx2, 2, w, 16);

      });
      h += '</div>';
      h += '<table class="fr"><tr><th>#</th><th>Bron</th><th>In</th><th>Uit</th><th>Brondur</th><th>Doeldur</th><th>Ratio</th><th>Preset</th><th>Modus</th><th></th></tr>';
      frs.forEach(function (f, i) {
        var fi = fitInfo.frags[f.id] || {};
        var tg = num(fi, ['targetDuration', 'doeldur', 'outDuration', 'target', 'targetDur']);
        var ratio = fi.ratio, st = fi.status || (ratio != null ? stat(ratio) : '');
        var missing = !hasAudio(f.source);
        var rt = '';
        if (ratio != null) {
          rt = '<span class="badge ' + esc(st) + '">' + Number(ratio).toFixed(3) + (st === 'blocked' ? ' geblokkeerd' : '') + '</span>';
          if (f.mode === 'varispeed') rt += ' <span class="dim">' + (12 * Math.log(ratio) / Math.LN2).toFixed(2) + ' ht</span>';
        }
        h += '<tr data-f="' + f.id + '"' + (missing ? ' class="miss" title="Bron niet geladen"' : '') + '><td>' + (i + 1) + '</td><td>' + esc(f.source) + (missing ? ' (niet geladen)' : '') + '</td><td>' + fmt(f.in) + '</td><td>' + fmt(f.out) + '</td><td>' + (f.out - f.in).toFixed(3) + ' s</td><td>' + (tg != null ? tg.toFixed(3) + ' s' : '') + '</td><td>' + rt + '</td>' +
          '<td><select class="pr"><option value="music">music</option><option value="voice">voice</option></select></td>' +
          '<td><select class="md"><option value="pitch">pitch</option><option value="varispeed">varispeed</option></select></td>' +
          '<td><button class="op" title="Open in golfvorm">&#8599;</button> <button class="df" title="Verwijderen">&times;</button></td></tr>';
      });
      h += '</table>';
    } else h += '<div class="dim" style="margin:4px 0">Leeg blok: maak een selectie en druk Enter.</div>';
    el.innerHTML = h;
    // handlers
    el.addEventListener('mousedown', function () { if (activeBlock !== b.id) { activeBlock = b.id; document.querySelectorAll('.blk').forEach(function (x) { x.classList.remove('active'); }); el.classList.add('active'); el.querySelector('input[type=radio]').checked = true; } });
    el.querySelector('.fm').value = b.fitMode || 'proportional';
    el.querySelector('.fm').onchange = function (e) { run('update_block', { block: b.id, fitMode: e.target.value }); };
    var nm = el.querySelector('.nm'); nm.onchange = function () { var r = run('update_block', { block: b.id, name: nm.value }); if (!r.ok) renderBlocks(); };
    var td = el.querySelector('.td'); td.onchange = function () {
      var d = parseFloat(String(td.value).replace(',', '.'));
      if (!(d > 0)) { say('Doelduur moet positief zijn.', 'err'); renderBlocks(); return; }
      var r = run('update_block', { block: b.id, targetDuration: r3(d) }); if (!r.ok) renderBlocks();
    };
    el.querySelector('.del').onclick = function () { if (confirm('Blok "' + b.name + '" verwijderen?')) { if (activeBlock === b.id) activeBlock = null; run('delete_block', { block: b.id }); } };
    el.querySelector('.pv').onclick = function () { previewBlock(b); };
    el.querySelector('.wv').onclick = function () { exportBlock(b); };
    el.querySelectorAll('tr[data-f]').forEach(function (tr) {
      var fid = tr.dataset.f, f = (b.fragments || []).filter(function (x) { return x.id === fid; })[0];
      tr.querySelector('.pr').value = f.preset || 'music';
      tr.querySelector('.md').value = f.mode || 'pitch';
      tr.querySelector('.pr').onchange = function (e) { run('update_fragment', { fragment: fid, preset: e.target.value }); };
      tr.querySelector('.md').onchange = function (e) { run('update_fragment', { fragment: fid, mode: e.target.value }); };
      tr.querySelector('.df').onclick = function () { run('delete_fragment', { fragment: fid }); };
      tr.querySelector('.op').onclick = function () {
        if (!src(f.source)) { say('Bron ' + f.source + ' bestaat niet.', 'err'); return; }
        setActive(f.source);
        var v = view(f.source); v.sel = { in: f.in, out: f.out };
        var vd = CW / v.pps; if (f.in < v.viewStart || f.out > v.viewStart + vd) { v.viewStart = f.in - vd * 0.1; clampView(v); }
        renderFields(); draw();
      };
    });
    box.appendChild(el);
  });
  box.parentNode.scrollTop = keepScroll;
}
async function previewBlock(b) {
  await ensureCtx();
  if (play && play.kind === 'block' && play.block === b.id) { stopPlay(); return; }
  var missing = (b.fragments || []).filter(function (f) { return !hasAudio(f.source); });
  if (missing.length) { say('Bron(nen) niet geladen: ' + missing.map(function (f) { return f.source; }).join(', '), 'err'); return; }
  say('Blok "' + b.name + '" renderen...');
  await new Promise(function (r) { setTimeout(r, 20); });
  var r = run('render_block', { block: b.id });
  if (!r.ok) return;
  var res = r.result || {};
  var rb = AF.getRendered(b.id);
  if (!rb) { say('Geen gerenderde audio beschikbaar voor ' + b.name + '.', 'err'); return; }
  var buf = ctx.createBuffer(rb.channels.length, rb.channels[0].length, rb.sampleRate);
  for (var i = 0; i < rb.channels.length; i++) buf.copyToChannel(rb.channels[i], i);
  var msg = 'Blok "' + b.name + '": ' + (res.duration != null ? res.duration.toFixed(3) + ' s' : '') + (res.peakDb != null ? ', piek ' + Number(res.peakDb).toFixed(1) + ' dBFS' : '');
  say(msg + (res.clipped ? ' - CLIPPING (begrensd op 0 dBFS)' : ''), res.clipped ? 'warn' : 'ok');
  startBuf(buf, 0, buf.duration, false, 'block', { block: b.id });
}
function exportBlock(b) {
  var missing = (b.fragments || []).filter(function (f) { return !hasAudio(f.source); });
  if (missing.length) { say('Bron(nen) niet geladen: ' + missing.map(function (f) { return f.source; }).join(', '), 'err'); return; }
  var r = run('export_block', { block: b.id });
  if (!r.ok) return;
  var files = (r.result && r.result.files) || [];
  if (!files.length) { say('Export gaf geen bestanden.', 'err'); return; }
  files.forEach(function (f, i) {
    var url = URL.createObjectURL(new Blob([f.bytes], { type: 'audio/wav' }));
    setTimeout(function () {
      var a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }, i * 300);
  });
  say('Geexporteerd: ' + files.map(function (f) { return f.name; }).join(', '), 'ok');
}

/* ---------- bronnenlijst ---------- */
function renderSources() {
  var box = $('sources'); box.innerHTML = '';
  if (!R.sources.length) { box.innerHTML = '<div class="dim">Geen bronnen.</div>'; return; }
  R.sources.forEach(function (s) {
    var d = document.createElement('div'), ok = hasAudio(s.name);
    d.className = 'src' + (s.name === activeSrc ? ' active' : '') + (ok ? '' : ' missing');
    d.innerHTML = '<span>' + esc(s.name) + '</span><span class="meta">' + (ok ? fmt(s.duration) : 'nog in te laden') + '</span>';
    d.onclick = function () { setActive(s.name); };
    box.appendChild(d);
  });
}
function setActive(name) {
  if (play && play.kind === 'src') stopPlay();
  activeSrc = name;
  renderSources(); renderMarkers(); fitIfNeeded(); renderFields(); draw();
}

/* ---------- state-subscribe ---------- */
function refreshState() {
  var r = AF.exec({ cmd: 'get_state', args: {} });
  if (r.ok && r.result) onState(r.result);
}
function onState(rec) {
  R = rec;
  R.sources = R.sources || []; R.blocks = R.blocks || [];
  if (!activeSrc || !src(activeSrc)) activeSrc = R.sources.length ? R.sources[0].name : null;
  if (activeBlock && !blockById(activeBlock)) activeBlock = null;
  if (!activeBlock && R.blocks.length) activeBlock = R.blocks[R.blocks.length - 1].id;
  renderSources(); renderMarkers(); renderBlocks(); renderFields(); fitIfNeeded(); draw();
  setTimeout(refreshFit, 0);
}
AF.subscribe(onState);

/* ---------- knoppen en toetsen ---------- */
function doUndo() { var r = run('undo'); if (r.ok) say('Ongedaan gemaakt.'); }
function doRedo() { var r = run('redo'); if (r.ok) say('Opnieuw uitgevoerd.'); }
$('btnUndo').onclick = doUndo; $('btnRedo').onclick = doRedo;

document.addEventListener('keydown', function (e) {
  var t = e.target, tag = t && t.tagName;
  var inField = tag === 'INPUT' && (t.type === 'text' || t.type === 'number') || tag === 'SELECT' || tag === 'TEXTAREA';
  if ((e.ctrlKey || e.metaKey) && !inField) {
    var k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); doRedo(); return; }
  }
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
  var v = V();
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'i': case 'I':
      if (!v) break;
      var ti = cursorNow(); if ($('chkSnap').checked) ti = zsnap(ti); ti = r3(ti);
      v.sel = { in: ti, out: v.sel ? Math.max(v.sel.out, ti) : ti }; renderFields(); draw(); break;
    case 'o': case 'O':
      if (!v) break;
      var to = cursorNow(); if ($('chkSnap').checked) to = zsnap(to); to = r3(to);
      v.sel = { in: v.sel ? Math.min(v.sel.in, to) : to, out: to }; renderFields(); draw(); break;
    case 'm': case 'M': if (v) { e.preventDefault(); addMarkerAt(cursorNow()); } break;
    case 'l': case 'L': $('chkLoop').checked = !$('chkLoop').checked; $('chkLoop').onchange(); break;
    case 'Enter': e.preventDefault(); addSelectionToBlock(); break;
  }
});

/* ---------- start ---------- */
refreshState();
resize();
updatePlayBtn();
window.__editor = { get state() { return R; }, say: say };
})();
</script>
