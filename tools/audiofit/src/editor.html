<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Audio Fit Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3743; --text:#dde3ea; --dim:#8b97a6;
  --accent:#4ea1ff; --accent2:#2f6fb5; --marker:#ffb74d; --cursor:#ff5a5a; --wave:#6fcf97;
  --green:#3fb950; --orange:#e3a008; --red:#e5534b; --blocked:#8e44ad;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent2);border-color:var(--accent)}
input[type=text],input[type=number],select{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input[type=text]:focus,select:focus{outline:1px solid var(--accent)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
header h1 small{color:var(--dim);font-weight:400;margin-left:6px}
header .sp{flex:1}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{flex:1 1 40%;min-height:230px;display:grid;grid-template-columns:190px 1fr 220px;border-bottom:1px solid var(--line)}
.side{background:var(--panel);overflow:auto;padding:6px}
.side h2,.blocks h2{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:2px 2px 6px;text-transform:uppercase}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.src{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;gap:4px;align-items:center;word-break:break-all}
.src:hover{background:var(--panel2)}
.src.active{background:var(--accent2)}
.src .meta{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.src.missing{color:var(--orange)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.wavewrap{position:relative;flex:1;min-height:150px;background:#0c0f13}
.wavewrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
.wavewrap.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
#scroll{width:100%;margin:0;height:14px;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctrl .grp{display:flex;align-items:center;gap:4px}
.ctrl label{color:var(--dim)}
.tf{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.nud button{padding:2px 5px;font-size:11px}
.chk{display:flex;align-items:center;gap:3px;color:var(--text)}
.mrow{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow .mn{flex:1;word-break:break-all}
.mrow .mt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.mrow button{padding:0 5px;font-size:11px}
.between{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:grid;gap:4px}
.between select{width:100%}
.blocks{flex:1 1 60%;min-height:200px;overflow:auto;background:var(--bg);padding:6px 10px}
.blocks .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:6px 8px}
.blk.active{border-color:var(--accent)}
.blk .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .bh .nm{width:130px}
.blk .bh .td{width:84px;text-align:right}
.badge{padding:1px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.green{background:rgba(63,185,80,.18);color:var(--green);border-color:var(--green)}
.orange{background:rgba(227,160,8,.18);color:var(--orange);border-color:var(--orange)}
.red{background:rgba(229,83,75,.18);color:var(--red);border-color:var(--red)}
.blocked{background:rgba(142,68,173,.25);color:#c58be0;border-color:var(--blocked)}
.seg{display:none}
.seg div{background:var(--accent2);border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;min-width:6px;border-bottom:3px solid transparent}
.seg div{color:#fff!important}
.seg div.green{border-bottom-color:var(--green)}.seg div.orange{border-bottom-color:var(--orange)}
.seg div.red{border-bottom-color:var(--red)}.seg div.blocked{border-bottom-color:var(--blocked)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
table.fr{border-collapse:collapse;width:100%;font-size:12px}
table.fr th{color:var(--dim);text-align:left;font-weight:500;padding:2px 6px;border-bottom:1px solid var(--line)}
table.fr td{padding:2px 6px;border-bottom:1px solid #242a33;font-variant-numeric:tabular-nums}
table.fr select{padding:1px 3px}
tr.miss td{color:var(--orange)}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 10px;display:flex;gap:10px;align-items:center;position:relative}
#status{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#status.err{color:var(--red)}#status.warn{color:var(--orange)}#status.ok{color:var(--green)}
#log{position:absolute;left:0;right:0;bottom:100%;max-height:220px;overflow:auto;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;display:none;font-size:12px}
#log div.err{color:var(--red)}#log div.warn{color:var(--orange)}
#ctx{position:fixed;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px;z-index:50;min-width:130px}
#ctx div{padding:5px 12px;cursor:pointer}#ctx div:hover{background:var(--accent2)}
#mname{position:absolute;display:none;z-index:20;width:120px}
.dim{color:var(--dim)}
.tl{position:relative;margin:6px 0;user-select:none}
.tl .ruler{position:relative;height:14px;color:var(--dim);font-size:10px}
.tl .ruler span{position:absolute;top:0;border-left:1px solid var(--line);padding-left:3px;height:14px;white-space:nowrap}
.tl .row{position:relative;height:40px;background:#12161c;border:1px solid var(--line);border-radius:4px;margin-top:2px;overflow:hidden}
.tl + .row,.row.voice{height:32px}
.tl .hint{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;color:var(--dim);font-size:11px}
.endline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);z-index:6;pointer-events:none}
.tfr{position:absolute;top:3px;bottom:3px;background:var(--accent2);border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;border-bottom:3px solid transparent;color:#fff;cursor:grab;z-index:1}
.tfr.green{border-bottom-color:var(--green)}.tfr.orange{border-bottom-color:var(--orange)}.tfr.red{border-bottom-color:var(--red)}.tfr.blocked{border-bottom-color:var(--blocked)}
.tfr.sel,.tvo.sel{outline:2px solid #fff;outline-offset:-1px}
.tfr.miss{background:#6b5a1f}
.tfr.anc{outline:2px dashed var(--marker);outline-offset:-2px}
.tfr.dragging,.tvo.dragging{opacity:.8;z-index:8;cursor:grabbing}
.tfr .rt,.tvo .rt{opacity:.75;margin-left:6px;font-size:10px}
.tz{position:absolute;top:0;bottom:0;z-index:4;cursor:pointer;font-size:9px;color:#fff;overflow:visible;white-space:nowrap}
.tz span{position:absolute;left:2px;top:1px;pointer-events:none;text-shadow:0 0 2px #000}
.tz.ov{background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,rgba(255,255,255,.15) 3px 6px);border-left:1px solid #fff;border-right:1px solid #fff}
.tz.ov.duck{background:repeating-linear-gradient(45deg,rgba(255,183,77,.8) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.ov.mix{background:repeating-linear-gradient(45deg,rgba(229,83,75,.7) 0 3px,rgba(255,255,255,.15) 3px 6px)}
.tz.gap{background:rgba(0,0,0,.65);border:1px dashed var(--dim)}
.tz.cut::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.tz .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tz .h.l{left:-4px}.tz .h.r{right:-4px}
.tz .h:hover{background:rgba(78,161,255,.7)}
.tz.sel{box-shadow:0 0 0 2px #ffd54f}
.duckz{position:absolute;top:0;bottom:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(-45deg,rgba(255,183,77,.30) 0 4px,rgba(255,183,77,.08) 4px 8px);border-bottom:3px solid var(--marker)}
.dropline{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #ffd54f;z-index:9;pointer-events:none}
.tlcur{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--cursor);z-index:10;display:none;pointer-events:none}
.tvo{position:absolute;top:5px;bottom:5px;background:#7b4fa8;border-radius:3px;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 5px;color:#fff;cursor:grab;z-index:2;border-bottom:3px solid transparent}
.tvo.green{border-bottom-color:var(--green)}.tvo.orange{border-bottom-color:var(--orange)}.tvo.red{border-bottom-color:var(--red)}.tvo.blocked{border-bottom-color:var(--blocked)}
.tvo.ovl{box-shadow:0 0 0 2px var(--red)}
.ancl{position:absolute;top:2px;height:0;border-top:1px dashed var(--marker);z-index:1;pointer-events:none}
.ancl b{position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--marker)}
table.fr td.grip{cursor:grab;color:var(--dim);width:16px;text-align:center}
table.fr tr{cursor:pointer}
table.fr tr.sel td{background:rgba(78,161,255,.14)}
table.fr tr.dropb td{border-top:2px solid #ffd54f}table.fr tr.dropa td{border-bottom:2px solid #ffd54f}
table.vt{margin-top:6px}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin-top:6px}
.detail .drow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:5px}
.detail .df{display:flex;align-items:center;gap:4px;color:var(--dim)}
.detail .df input[type=text]{text-align:right}
.warnbox,.errbox{margin:4px 0;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid var(--orange);background:rgba(227,160,8,.14);color:var(--orange)}
.errbox{border-color:var(--red);background:rgba(229,83,75,.14);color:var(--red)}
.errbox .x{float:right;padding:0 6px}
.wlist{margin:3px 0;font-size:11px;color:var(--orange)}
.rprog{align-items:center;gap:8px;margin:3px 0;font-size:12px}
.rprog .bar,.sprog .bar{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.rprog .bar i,.sprog .bar i{display:block;height:100%;width:0;background:var(--accent)}
.rprog .pct,.sprog .pct{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.rprog .lab,.sprog .lab{color:var(--dim);white-space:nowrap}
.sprog{display:none;align-items:center;gap:8px;font-size:12px;flex:none}
button.busy{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:520px}
.modal h3{margin:0 0 8px;font-size:15px}.modal p{margin:0 0 14px;color:var(--dim)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end}
header{flex-wrap:wrap}
header #hint{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
header .chk{white-space:nowrap}
button.dirty{border-color:var(--orange);color:var(--orange)}
#missing{display:none;margin:6px 0;padding:5px 7px;border:1px solid var(--orange);border-radius:4px;background:rgba(227,160,8,.12);font-size:12px}
#missing .mh{color:var(--orange);font-weight:600}#missing .mi{padding-left:8px;word-break:break-all}
.modal .box.wide{width:min(820px,94vw);max-width:none;max-height:88vh;overflow:auto}
.modal .phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.modal .phead h3{margin:0;flex:1}
.modal h4{margin:12px 0 4px;font-size:13px}
.modal textarea{background:#0f1216;border:1px solid var(--line);border-radius:4px;color:var(--text);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:6px}
.cmsg{margin:4px 0;font-size:12px}.cmsg.ok{color:var(--green)}.cmsg.warn{color:var(--orange)}
.aiprev ol,.aires ol{margin:4px 0;padding-left:24px}.aiprev li,.aires li{margin:2px 0}
.aires li.ok{color:var(--green)}.aires li.bad{color:var(--red)}.aires li.dim{color:var(--dim)}
.okbox{margin:4px 0;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid var(--green);background:rgba(63,185,80,.14);color:var(--green)}
.stlist{list-style:none;margin:6px 0;padding:0;font-size:12px}.stlist li{margin:2px 0}.stlist li.ok{color:var(--green)}.stlist li.bad{color:var(--red)}
.help div{margin:3px 0}
@keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}
.bar.indet i{width:40%!important;animation:indet 1.1s linear infinite}
.sprog .bar.indet{width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.sprog .bar.indet i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Audio Fit Tool <small id="ver"></small></h1>
  <button id="btnLoad" title="Audiobestanden laden">Laden</button>
  <input id="file" type="file" accept="audio/*,.wav,.mp3" multiple hidden>
  <button id="btnUndo" title="Ongedaan maken (Ctrl+Z)">&#8630;</button>
  <button id="btnRedo" title="Opnieuw (Ctrl+Y)">&#8631;</button>
  <button id="btnRecipe" title="Recept opslaan of laden">Recept &#8645;</button>
  <input id="recFile" type="file" accept=".json,application/json" hidden>
  <button id="btnAI" title="Claude aansturen via kopieren en plakken">AI &#8645;</button>
  <span class="sp"></span>
  <label class="chk" title="Piek van elk geexporteerd blok naar -1 dBFS"><input type="checkbox" id="chkNorm"> normaliseer (&minus;1 dBFS)</label>
  <button id="btnExportAll" title="Alle blokken achter elkaar als losse WAV-downloads">Alle blokken exporteren</button>
  <button id="btnHelp" title="Hulp, sneltoetsen en zelftest">?</button>
  <span class="dim" id="hint">Spatie afspelen &middot; I/O in/uit &middot; M marker &middot; L loop &middot; Enter selectie &rarr; blok &middot; Shift+Enter &rarr; stem</span>
</header>
<main>
  <div class="top">
    <div class="side left"><h2>Bronnen</h2><div id="missing"></div><div id="sources"></div></div>
    <div class="center">
      <div class="wavewrap" id="wavewrap">
        <canvas id="cv"></canvas>
        <div class="drop" id="dropmsg">Sleep WAV- of MP3-bestanden hierheen, of kies Laden.</div>
        <input type="text" id="mname" placeholder="naam (leeg = auto)">
      </div>
      <input type="range" id="scroll" min="0" max="1000" value="0" step="1">
      <div class="ctrl">
        <div class="grp"><label>in</label><input class="tf" type="text" id="fIn">
          <span class="nud"><button data-f="in" data-d="-10">-10</button><button data-f="in" data-d="-1">-1</button><button data-f="in" data-d="1">+1</button><button data-f="in" data-d="10">+10</button></span></div>
        <div class="grp"><label>uit</label><input class="tf" type="text" id="fOut">
          <span class="nud"><button data-f="out" data-d="-10">-10</button><button data-f="out" data-d="-1">-1</button><button data-f="out" data-d="1">+1</button><button data-f="out" data-d="10">+10</button></span></div>
        <div class="grp"><label>duur</label><input class="tf" type="text" id="fDur"></div>
        <div class="grp"><label>cursor</label><span id="curtxt" class="tf" style="display:inline-block">0:00.000</span></div>
      </div>
      <div class="ctrl" style="border-top:none">
        <button id="btnPlay">&#9654; Afspelen</button>
        <label class="chk"><input type="checkbox" id="chkLoop"> loop (L)</label>
        <label class="chk"><input type="checkbox" id="chkLast2"> alleen laatste 2 s</label>
        <label class="chk"><input type="checkbox" id="chkSnap" checked> snap nuldoorgang</label>
        <button id="btnMarker">M marker</button>
        <button id="btnToBlock">&rarr; blok (Enter)</button>
        <button id="btnToVoice" title="Selectie als stemfragment in het actieve blok (Shift+Enter)">&rarr; stem (Shift+Enter)</button>
        <label>anker</label><select id="vAnchor" title="Muziekfragment waaraan de stem hangt"></select>
        <label>offset</label><input class="tf" type="text" id="vOffset" value="0.000" style="width:64px" title="Seconden na het begin van het anker"><span class="dim">s</span>
        <button id="btnFit">Hele bron</button>
      </div>
    </div>
    <div class="side right">
      <h2>Markers</h2><div id="markers"></div>
      <div class="between">
        <h2>Selecteer tussen markers</h2>
        <select id="selA"></select><select id="selB"></select>
        <button id="btnBetween">Selecteer</button>
      </div>
    </div>
  </div>
  <div class="blocks">
    <div class="bar"><h2 style="margin:0">Blokken</h2>
      <input type="text" id="nbName" placeholder="Bloknaam" style="width:140px">
      <input type="text" id="nbDur" value="15.000" style="width:70px;text-align:right" title="Doelduur in seconden">
      <span class="dim">s</span>
      <button id="btnNewBlock">+ nieuw blok</button>
    </div>
    <div id="blocklist"></div>
  </div>
</main>
<footer>
  <div id="log"></div>
  <div class="sprog" id="sprog"><div class="bar"><i></i></div><span class="pct"></span><span class="lab"></span></div>
  <div id="status" title="Klik voor het logboek">Klaar.</div>
</footer>
<div id="ctx"></div>
<div class="modal" id="panel"><div class="box wide"><div class="phead"><h3></h3><button id="panelClose">Sluiten</button></div><div class="pbody"></div></div></div>
<div class="modal" id="modal"><div class="box"><h3></h3><p></p><div class="btns"></div></div></div>

<script id="audiofit-core">/*@@CORE@@*/</script>
<script>
(function () {
'use strict';
var AF = window.AudioFit;
var $ = function (id) { return document.getElementById(id); };

/* ---------- statusbalk ---------- */
var logEl = $('log'), statusEl = $('status'), logItems = [];
function say(msg, level) {
  level = level || '';
  statusEl.textContent = msg; statusEl.className = level;
  logItems.push({ msg: msg, level: level });
  if (logItems.length > 60) logItems.shift();
  var d = document.createElement('div'); d.className = level; d.textContent = msg; logEl.appendChild(d);
  while (logEl.childNodes.length > 60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
statusEl.addEventListener('click', function () { logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block'; });

if (!AF) { say('Kern (AudioFit) ontbreekt: bouw audiofit.html met build.mjs.', 'err'); return; }
$('ver').textContent = 'v' + AF.version;

/* ---------- hulpfuncties ---------- */
function run(cmd, args) {
  var r = AF.exec({ cmd: cmd, args: args || {} });
  if (!r.ok) say(r.error, 'err');
  return r;
}
function fmt(t) {
  if (t == null || !isFinite(t)) return '';
  var neg = t < 0; t = Math.abs(t);
  var ms = Math.round(t * 1000), m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return (neg ? '-' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + ('00' + r).slice(-3);
}
function parseT(str) {
  str = String(str).trim().replace(',', '.');
  if (!str) return NaN;
  var p = str.split(':'), v = 0;
  if (p.length > 3) return NaN;
  for (var i = 0; i < p.length; i++) { if (!/^\d*\.?\d*$/.test(p[i]) || p[i] === '') return NaN; v = v * 60 + parseFloat(p[i]); }
  return v;
}
function r3(x) { return Math.round(x * 1000) / 1000; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- state ---------- */
var R = { sources: [], blocks: [] };      // recept (uit kern)
var views = {};                            // per bron: {viewStart, pps, sel, cursor}
var activeSrc = null, activeBlock = null;
var fitInfo = { frags: {}, blocks: {} }, fitKey = '';
var ctx = null, srOK = false;
var bufCache = {};                         // bron -> {key, buf}
var peakCache = {};                        // bron -> {B, mins, maxs, sr, n}

function src(name) { for (var i = 0; i < R.sources.length; i++) if (R.sources[i].name === name) return R.sources[i]; return null; }
function curSrc() { return activeSrc ? src(activeSrc) : null; }

    try {
      var ab = await f.arrayBuffer();
      var buf = await ctx.decodeAudioData(ab);
      if (buf.duration > 1200) say(f.name + ': ' + fmt(buf.duration) + ' lang (> 20 min); dit gebruikt veel geheugen. Toch geladen.', 'warn');
      var chans = [];
      for (var c = 0; c < buf.numberOfChannels; c++) chans.push(new Float32Array(buf.getChannelData(c)));
      if (!srOK) {

        srOK = true;

      var rs = src(f.name), wasMissing = !!rs && !hasAudio(f.name), exists = hasAudio(f.name);
      var used = AF.attachAudio(f.name, { sampleRate: buf.sampleRate, channels: chans, rename: exists }, exists ? { rename: true } : undefined);
      if (used && typeof used === 'object') used = used.name || used.used || f.name;
      used = used || f.name;
      delete peakCache[used]; delete bufCache[used]; delete views[used];
      refreshState();
      if (!first) first = used;
      ok++;
      say('Geladen: ' + used + ' (' + fmt(buf.duration) + ', ' + buf.numberOfChannels + ' kanaal/kanalen).' + (wasMissing ? ' Gekoppeld aan het recept.' : ''), 'ok');
      if (wasMissing && rs && Math.abs(rs.duration - buf.duration) > 0.01) say(used + ': duur in het recept ' + fmt(rs.duration) + ', geladen bestand ' + fmt(buf.duration) + '. Is dit hetzelfde bestand?', 'warn');
    } catch (e) {

    }

}

/* ---------- piekdata ---------- */
function getBase(name) {
  var pc = peakCache[name];
  if (pc) return pc;
  var a = AF.getAudio(name);
  if (!a) return null;
  var B = 64, n = a.channels[0].length, nb = Math.ceil(n / B);
  var mins = new Float32Array(nb), maxs = new Float32Array(nb);
  for (var b = 0; b < nb; b++) { mins[b] = 1; maxs[b] = -1; }
  for (var c = 0; c < a.channels.length; c++) {
    var d = a.channels[c];
    for (var b2 = 0; b2 < nb; b2++) {
      var s0 = b2 * B, s1 = Math.min(n, s0 + B), mn = mins[b2], mx = maxs[b2];
      for (var s = s0; s < s1; s++) { var v = d[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
      mins[b2] = mn; maxs[b2] = mx;
    }

  pc = peakCache[name] = { B: B, mins: mins, maxs: maxs, sr: a.sampleRate, n: n, audio: a };
  return pc;

/* ---------- muis ---------- */

var jobs = {}, queue = [], running = null, jobSeq = 0;

  'self.onmessage=function(e){var m=e.data;' +
  'if(m.type==="audio"){audio[m.name]={sampleRate:m.sampleRate,channels:m.channels};cache.clear();}' +
  'else if(m.type==="render"){try{var res=AudioFit.renderBlockPure(m.recipe,audio,m.blockId,{onProgress:function(f,l){self.postMessage({type:"progress",jobId:m.jobId,fraction:f,label:l});},cache:cache});' +
  'self.postMessage({type:"done",jobId:m.jobId,sampleRate:res.sampleRate,channels:res.channels,stats:res.stats,warnings:res.warnings},res.channels.map(function(c){return c.buffer;}));}' +
  'catch(err){self.postMessage({type:"error",jobId:m.jobId,message:String(err&&err.message||err)});}}};})();';

function stampOf(name) {

  var s = audioStamp[name];

  return s.id;
}

  return Object.keys(n);

}

function pause(ms) { return new Promise(function (r) { setTimeout(r, ms || 20); }); }

// o: {key, ui, ref, purpose, make(), onDone(res), label}
function startRender(o) {

function getWorker() {

  var core = document.getElementById('audiofit-core').textContent;

  wk = new Worker(url); wkSent = {}; wkGotMsg = false;

  var me = wk;

    '2. Zet markers (M) op belangrijke punten; "Selecteer tussen markers" kiest het stuk tussen twee markers.',
    '3. Maak een blok met een doelduur (+ nieuw blok) en voeg selecties toe (Enter). De tool rekt of dikt de fragmenten in zodat het blok exact de doelduur heeft.',
    '4. Stel overgangen in en let op de ratio-kleur (groen is goed, rood/paars is te veel rek). Voorbeluisteren met het blok-afspeelknopje.',
    '5. Voeg zo nodig een stem toe (Shift+Enter) met anker en offset; de muziek zakt eronder (ducking).',
    '6. Exporteer per blok (WAV) of alle blokken; kies eventueel normaliseren (piek -1 dBFS).',
    '7. Recept \u21c5 slaat het project op als .json (zonder audio); bij laden koppelt de tool de bronnen op bestandsnaam.',
    '8. AI \u21c5: kopieer de context naar een Claude-chat en plak het antwoord (JSON-commando\'s) terug; \u00e9\u00e9n Ongedaan maken draait de hele reeks terug.'
  ];
  openPanel('Hulp \u2014 Audio Fit Tool v' + AF.version, [
    el('h4', { text: 'Werkwijze' }), el('div', { class: 'help' }, steps.map(function (s) { return el('div', { text: s }); })),
    el('h4', { text: 'Sneltoetsen' }), table,
    el('h4', { text: 'Zelftest' }), el('div', { class: 'dim', text: 'Controleert de rekenkern (criteria 2 t/m 7) met gegenereerde signalen. Draait op de achtergrond; de editor blijft bedienbaar.' }),
    el('div', { style: 'margin:6px 0' }, [btn]), bar, out
  ]);
}
$('btnHelp').onclick = openHelpPanel;

/* ---------- export: normaliseren, alles exporteren ---------- */
var clipInfo = {};       // blok-id -> {sig, text}
function peakOf(chans) {
  var p = 0;
  for (var c = 0; c < chans.length; c++) { var d = chans[c]; for (var i = 0; i < d.length; i++) { var v = d[i] < 0 ? -d[i] : d[i]; if (v > p) p = v; } }
  return p;
}
function dbOf(p) { return p > 0 ? 20 * Math.log(p) / Math.LN10 : -Infinity; }
function noteClip(b, text) { clipInfo[b.id] = { sig: blockJson(b.id), text: text }; renderBlocks(); }
function clipWarnHTML(b) {
  var c = clipInfo[b.id];
  if (!c) return '';
  if (c.sig !== blockJson(b.id)) { delete clipInfo[b.id]; return ''; }
  return '<div class="warnbox clipw">&#9888; ' + esc(c.text) + '</div>';
}
function exportBlock(b) {
  if (!checkSources(b)) return false;
  var bi = fitInfo.blocks[b.id];
  if (bi && bi.exportable === false) { say('Export geblokkeerd voor ' + b.name + ': ' + ((bi.error || (bi.warnings || []).join('; ')) || 'het blok klopt niet'), 'err'); return false; }
  var norm = $('chkNorm').checked;
  startRender(mkBlockJob(b, 'wav', 'export', function (res) {
    var st = res.stats || {}, chans = res.channels, peak = peakOf(chans), applied = 1, clipped = false;
    if (norm && peak > 0) {
      applied = Math.pow(10, -1 / 20) / peak;
      chans = chans.map(function (ch) { var o = new Float32Array(ch.length); for (var i = 0; i < ch.length; i++) o[i] = ch[i] * applied; return o; });
    } else clipped = peak > 1 || !!st.clipped;
    var name = (b.name + '_' + Number(b.targetDuration).toFixed(3) + 's.wav').replace(/[\\\/:*?"<>|]/g, '_');
    var bytes = AF.wav.encode(chans, res.sampleRate), outDb = dbOf(norm && peak > 0 ? peak * applied : Math.min(peak, 1));
    downloadBytes(name, bytes); exportSeq++;
    window.__lastExport = { name: name, bytes: bytes.length, samples: chans[0].length, peakDb: outDb, srcPeakDb: dbOf(peak), clipped: clipped, normalized: norm && peak > 0 };
    var txt = 'Geexporteerd: ' + name + ' (piek ' + (isFinite(outDb) ? outDb.toFixed(1) : '-oneindig') + ' dBFS' + (norm ? ', genormaliseerd' : '') + ')';
    if (clipped) {
      var w = 'CLIPPING: de piek van ' + b.name + ' is ' + dbOf(peak).toFixed(1) + ' dBFS (boven 0); in de export begrensd op \u00b11,0. Zet "normaliseer" aan of verlaag gainDb.';
      say(txt + ' - ' + w, 'warn'); noteClip(b, w);
    } else { delete clipInfo[b.id]; say(txt, 'ok'); renderBlocks(); }
  }));
  return true;
}
var exportingAll = false, exportSeq = 0;
async function exportAll() {
  if (exportingAll) return;
  if (!R.blocks.length) { say('Er zijn nog geen blokken om te exporteren.', 'warn'); return; }
  exportingAll = true; var btn = $('btnExportAll'); btn.disabled = true;
  var ids = R.blocks.map(function (b) { return b.id; }), ok = 0, skipped = [];
  try {
    for (var i = 0; i < ids.length; i++) {
      var b = blockById(ids[i]); if (!b) continue;
      btn.textContent = 'Exporteren ' + (i + 1) + '/' + ids.length + '...';
      var seq0 = exportSeq;
      if (exportBlock(b)) {
        await pause(30);
        while (jobs[b.id] || (running && running.key === b.id)) await pause(60);
        if (exportSeq > seq0) ok++; else skipped.push(b.name);
        await pause(300);
      } else skipped.push(b.name);
    }
  } finally { exportingAll = false; btn.disabled = false; btn.textContent = 'Alle blokken exporteren'; }
  say('Alle blokken: ' + ok + ' van ' + ids.length + ' geexporteerd' + (skipped.length ? '; overgeslagen: ' + skipped.join(', ') : '') + '.', skipped.length ? 'warn' : 'ok');
}
$('btnExportAll').onclick = exportAll;

/* ---------- start ---------- */
refreshState();
resize();
updatePlayBtn();
updateHistory();
window.__editor = { get state() { return R; }, say: say, get workerActive() { return !!wk; }, get useWorker() { return useWorker; }, get fit() { return fitInfo; }, get dirty() { return isDirty(); }, extractCommands: extractCommands };
})();
</script>
</body>
